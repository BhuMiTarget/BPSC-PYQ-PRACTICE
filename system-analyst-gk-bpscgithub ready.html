<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}:root{--p:#667eea;--s:#764ba2;--ok:#48bb78;--bad:#f5576c;--warn:#f59e0b;--bg:#f7fafc;--card:#fff;--text:#1a202c;--muted:#718096;--border:#e2e8f0}[data-theme=dark]{--bg:#1a202c;--card:#2d3748;--text:#f7fafc;--muted:#cbd5e0;--border:#4a5568}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.setup{min-height:100vh;background:linear-gradient(135deg,var(--p),var(--s));display:flex;align-items:center;justify-content:center;padding:20px}.setupbox{background:#fff;color:#1a202c;border-radius:24px;padding:30px;max-width:520px;width:100%;box-shadow:0 20px 60px #0005;text-align:center}.logo{font-size:48px}.modes{display:grid;gap:12px;text-align:left;margin:22px 0}.mode{width:100%;border:2px solid #e2e8f0;border-radius:15px;padding:16px;cursor:pointer;background:#fff;color:#1a202c;text-align:left;font:inherit}.mode.sel{border-color:var(--p);box-shadow:0 6px 20px #667eea33}.mode b{display:block;margin-bottom:4px}.timerin{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;margin:8px 0 18px}.start,.primary{border:0;background:linear-gradient(135deg,var(--p),var(--s));color:#fff;border-radius:11px;padding:13px 18px;font-weight:800;cursor:pointer}.start{width:100%}.start:disabled{opacity:.45}.app{display:none;height:100vh;grid-template-rows:auto 1fr auto}.header{background:var(--card);padding:14px 18px;border-bottom:1px solid var(--border);z-index:4}.hrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font-size:10px;background:var(--p);color:#fff;padding:4px 8px;border-radius:20px;text-transform:uppercase}.actions{display:flex;align-items:center;gap:8px}.theme{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;padding:8px;cursor:pointer}.clock{font-weight:800;color:var(--p);background:#667eea18;padding:8px 11px;border-radius:10px}.clock.warn{color:var(--bad);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.6}}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:10px}.barbg{height:6px;background:var(--border);border-radius:8px;margin-top:7px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--p),var(--s));width:0}.main{display:grid;grid-template-columns:1fr;min-height:0}.questionArea{overflow:auto;padding:18px}.card{max-width:850px;margin:auto;background:var(--card);border-radius:18px;padding:22px;box-shadow:0 4px 20px #0000000d}.qnum{display:inline-block;color:var(--p);font-size:12px;font-weight:800;background:#667eea18;padding:6px 11px;border-radius:20px}.qtext{font-size:17px;font-weight:700;line-height:1.65;white-space:pre-wrap;margin:16px 0}.qimage{display:block;max-width:100%;max-height:55vh;width:auto;height:auto;margin:14px auto;border-radius:12px;border:1px solid var(--border);object-fit:contain}.imgmissing{padding:12px;border:1px dashed var(--bad);color:var(--bad);border-radius:9px;margin:10px 0}.opts{display:grid;gap:11px}.opt{width:100%;text-align:left;border:2px solid var(--border);background:var(--bg);color:var(--text);border-radius:13px;padding:14px;display:flex;gap:11px;cursor:pointer;line-height:1.5}.letter{width:28px;height:28px;flex:0 0 28px;border:2px solid var(--border);background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}.opt.sel{border-color:var(--p);background:#667eea18}.opt.correct{border-color:var(--ok);background:#48bb781c}.opt.wrong{border-color:var(--bad);background:#f5576c1c}.opt.lock{cursor:default}.exp{margin-top:17px;border-left:4px solid var(--warn);background:#f59e0b18;padding:14px;border-radius:9px;line-height:1.6;white-space:pre-wrap}.navpanel{display:none;background:var(--card);border-left:1px solid var(--border);overflow:auto;padding:18px}.legend{font-size:12px;color:var(--muted);margin-bottom:13px}.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.qi{aspect-ratio:1;border:2px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);cursor:pointer}.qi.current{border-color:var(--p)}.qi.answered{background:var(--p);color:#fff;border-color:var(--p)}.qi.marked{background:var(--warn);color:#fff;border-color:var(--warn)}.qi.correct{background:var(--ok);color:#fff;border-color:var(--ok)}.qi.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}.bottom{background:var(--card);border-top:1px solid var(--border);padding:12px;display:flex;gap:8px}.navbtn{flex:1;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:12px;border-radius:10px;font-weight:700;cursor:pointer}.navbtn.primary{border:0}.submitany{background:#f5576c;color:#fff;border-color:#f5576c}.float{position:fixed;right:18px;bottom:82px;width:52px;height:52px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--s));color:#fff;font-size:20px;box-shadow:0 8px 20px #667eea55}.sheet{position:fixed;inset:auto 0 0;background:var(--card);border-radius:20px 20px 0 0;padding:20px;max-height:70vh;overflow:auto;transform:translateY(110%);transition:.25s;z-index:8;box-shadow:0 -10px 30px #0003}.sheet.open{transform:none}.results{display:none;padding:20px;min-height:100vh}.resbox{max-width:900px;margin:auto}.hero{text-align:center;background:var(--card);padding:32px;border-radius:18px}.hero .emoji{font-size:60px}.score{font-size:45px;font-weight:900;color:var(--p)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat{background:var(--card);padding:18px;border-radius:14px;text-align:center}.stat b{display:block;font-size:28px}.resactions{display:flex;gap:10px}.resactions button{flex:1}.overlay{position:fixed;inset:0;background:#0008;display:none;z-index:7}.overlay.open{display:block}
@media(min-width:1024px){.main{grid-template-columns:1fr 320px}.navpanel{display:block}.float,.sheet,.overlay{display:none!important}.questionArea{padding:28px}.card{padding:30px}.app{grid-template-rows:auto 1fr auto}}@media(max-width:600px){.stats{grid-template-columns:1fr}.qtext{font-size:16px}.bottom{padding:10px}.navbtn{font-size:13px;padding:11px 6px}}
</style></head><body>
<div class="setup" id="setup"><div class="setupbox"><div class="logo">🎓</div><h2>SYSTEM ANALYST GK BPSC</h2><p>Choose your preferred test mode</p><div class="modes" id="modes"><button type="button" class="mode" data-m="exam"><b>📄 Exam Mode</b><span>Complete all questions, results shown after submission</span></button><button type="button" class="mode" data-m="practice"><b>📖 Practice Mode</b><span>Instant feedback with detailed explanations</span></button></div><div id="timerConfig"><label>Custom Timer (minutes)</label><input class="timerin" id="mins" type="number" min="1" value="30"></div><button class="start" id="start">Start Quiz</button></div></div>
<div class="app" id="app"><header class="header"><div class="hrow"><div class="title">SYSTEM ANALYST GK BPSC <span class="badge" id="badge"></span></div><div class="actions"><button class="theme" id="theme">☾</button><div class="clock" id="clock">00:00</div></div></div><div class="meta"><span id="progressText"></span><span id="attempted"></span></div><div class="barbg"><div class="bar" id="bar"></div></div></header><main class="main"><section class="questionArea"><div class="card" id="question"></div></section><aside class="navpanel"><h3>Question Navigator</h3><div class="legend">Answered • Marked • Not Answered</div><div class="qgrid navgrid"></div></aside></main><footer class="bottom"><button class="navbtn" id="prev">Previous</button><button class="navbtn" id="mark">Mark</button><button class="navbtn primary" id="next">Next</button><button class="navbtn submitany" id="submitAny">Submit</button></footer><button class="float" id="float">▦</button><div class="overlay" id="overlay"></div><div class="sheet" id="sheet"><h3>Question Navigator</h3><div class="legend">Answered • Marked • Not Answered</div><div class="qgrid navgrid"></div></div></div>
<section class="results" id="results"><div class="resbox"><div class="hero"><div class="emoji" id="emoji"></div><h2 id="message"></h2><div class="score" id="score"></div><h3 id="percent"></h3></div><div class="stats" id="stats"></div><div class="resactions"><button class="primary" id="review">Review Answers</button><button class="navbtn" id="restart">Restart Quiz</button></div></div></section>
<script>
const DATA={"questions":[{"question":"दबे हुए ठोस कचरे में कार्बनिक पदार्थ निम्न के कारण विघटित होते हैं :","options":[{"text":"ऑक्सीकरण की क्रिया","correct":false},{"text":"सूक्ष्मजीवों की क्रिया","correct":true},{"text":"पानी का प्रवाह","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"दबे हुए ठोस कचरे (जैसे लैंडफिल) में ऑक्सीजन की अनुपस्थिति या कमी होती है। ऐसे में अवायवीय (anaerobic) एवं वायवीय सूक्ष्मजीवों (जीवाणु व कवक) की क्रियाशीलता के कारण कार्बनिक पदार्थों का अपघटन या विघटन होता है। इस प्रक्रिया से मीथेन और कार्बन डाइऑक्साइड जैसी गैसें बनती हैं।"},{"question":"यदि किसी चालक में 6 कूलॉम आवेश 2 सेकंड तक प्रवाहित हो तो विद्युत धारा कितनी होगी?","options":[{"text":"2 ए","correct":false},{"text":"3 ए","correct":true},{"text":"3 वी","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"विद्युत धारा ($I$) का सूत्र $I = \\frac{Q}{t}$ होता है, जहाँ $Q$ आवेश और $t$ समय है। यहाँ $Q = 6\\text{ C}$ तथा $t = 2\\text{ s}$ दिया गया है। अतः $I = \\frac{6}{2} = 3\\text{ Ampere (ए)}$ होगी।"},{"question":"आमतौर पर अभ्यस्त किया जाने वाला एसिड-बेस संकेतक है :","options":[{"text":"पेटूनिया अर्क","correct":false},{"text":"लिटमस घोल","correct":true},{"text":"हल्दी का घोल","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"अम्ल और क्षार की पहचान के लिए प्रयोगशालाओं तथा सामान्य प्रयोगों में सबसे व्यापक रूप से 'लिटमस घोल' (Litmus solution) का उपयोग किया जाता है। लिटमस एक प्राकृतिक सूचक है जो लाइकेन (Lichen) से प्राप्त होता है। यह अम्लीय माध्यम में लाल तथा क्षारीय माध्यम में नीला हो जाता है।"},{"question":"लोहे का शुद्धतम रूप है :","options":[{"text":"स्टील","correct":false},{"text":"कच्चा लोहा","correct":false},{"text":"गढ़ा लोहा","correct":true},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"पिटवाँ लोहा (Wrought iron या गढ़ा लोहा) लोहे का सबसे शुद्ध रूप माना जाता है, जिसमें कार्बन की मात्रा बहुत कम (लगभग 0.12% से 0.25%) होती है। ढलवाँ लोहा (Cast iron) और कच्चे लोहे (Pig iron) में कार्बन की मात्रा अधिक (2% से 4.5%) होती है।"},{"question":"प्रोटोजोआ में भोजन का पाचन निम्न में होता है :","options":[{"text":"साइटोप्लाज्म","correct":false},{"text":"संकुचनशील रिक्तिका","correct":false},{"text":"भोजन रिक्तिका","correct":true},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"प्रोटोजोआ (जैसे अमीबा) एककोशिकीय जीव हैं जिनमें भोजन का अंतर्ग्रहण होने के बाद वह 'भोजन रिक्तिका' (Food Vacuole) में बंद हो जाता है। यहाँ पाचक एंजाइम स्रावित होते हैं जो भोजन को पचाते हैं। संकुचनशील रिक्तिका (Contractile vacuole) जल संतुलन और उत्सर्जन का कार्य करती है।"},{"question":"पराग नलिकाओं का बीजांड की ओर बढ़ना किसका उदाहरण है :","options":[{"text":"जियोट्रोपिज्म","correct":false},{"text":"केमोट्रोपिज्म","correct":true},{"text":"हाइड्रोट्रोपिज्म","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"परागकण के बाद पराग नलिका (Pollen tube) का बीजांड (Ovule) की ओर विकास रासायनिक रसायनों (रसायन-अनुवर्तन) के प्रति अनुक्रिया के कारण होता है। रसायनों के प्रभाव से होने वाली इस वृद्धि को केमोट्रोपिज्म (Chemotropism या रसायनानुवर्तन) कहते हैं।"},{"question":"पर्यावरणीय कारकों द्वारा रूपांतर (वेरिएंट) का चयन निम्न का आधार बनता है :","options":[{"text":"प्रजनन प्रक्रिया","correct":false},{"text":"वंशानुगत विविधताएँ","correct":false},{"text":"विकासवादी प्रक्रियाएं","correct":true},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"डार्विन के प्राकृतिक चयन (Natural Selection) के सिद्धांत के अनुसार, पर्यावरण में होने वाले परिवर्तनों के अनुकूल जो विविधताएँ या रूपांतरण जीवों में बच जाते हैं, वही आगे चलकर जैव-विकास (Evolutionary processes) का आधार बनते हैं।"},{"question":"निर्वात का निरपेक्ष अपवर्तनांक है :","options":[{"text":"1 से अधिक","correct":false},{"text":"1 से कम","correct":false},{"text":"1","correct":true},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"किसी माध्यम का निरपेक्ष अपवर्तनांक (Absolute Refractive Index):\nn = c / v\nयहाँ:\n* n = माध्यम का निरपेक्ष अपवर्तनांक\n* c = निर्वात में प्रकाश की चाल (लगभग 3 × 10^8 मीटर/सेकंड)\n* v = माध्यम में प्रकाश की चाल\nमुख्य बिंदु:\n1. निर्वात के लिए: v = c, इसलिए n = c / c = 1\n2. हवा के लिए: n ≈ 1.0003 (व्यवहार में इसे 1 माना जाता है)\n3. अन्य सभी माध्यमों के लिए: प्रकाश की चाल निर्वात से कम होती है (v \u003c c), इसलिए उनका अपवर्तनांक हमेशा 1 से अधिक (n \u003e 1) होता है।"},{"question":"भारतीय कम्युनिस्ट पार्टी (CPI) का गठन किस शहर में हुआ था?","options":[{"text":"दिल्ली","correct":false},{"text":"कानपुर","correct":true},{"text":"कोलकाता","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"भारतीय कम्युनिस्ट पार्टी (CPI) की औपचारिक स्थापना भारत में 26 दिसंबर 1925 को कानपुर में आयोजित प्रथम भारतीय कम्युनिस्ट सम्मेलन में हुई थी। (अंशतः ताशकंद में 1920 में एम.एन. रॉय द्वारा भी प्रयास किया गया था, परंतु भारत की भूमि पर इसका गठन कानपुर में हुआ)।"},{"question":"1939 में जब सुभाष चंद्र बोस ने इस्तीफा दिया तो भारतीय राष्ट्रीय कांग्रेस के अध्यक्ष कौन बने?","options":[{"text":"राजेंद्र प्रसाद","correct":true},{"text":"जवाहर लाल नेहरू","correct":false},{"text":"अबुल कलाम आज़ाद","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"वर्ष 1939 के त्रिपुरी अधिवेशन में महात्मा गांधी के पसंदीदा उम्मीदवार पट्टाभि सितारमैय्या को हराकर सुभाष चंद्र बोस अध्यक्ष चुने गए थे। परंतु कार्यकारी समिति से मतभेदों के कारण बोस ने त्यागपत्र दे दिया। उनके त्यागपत्र के बाद डॉ. राजेंद्र प्रसाद को शेष अवधि के लिए कांग्रेस का अध्यक्ष बनाया गया।"},{"question":"बिहार के एक सदनीय विधानमंडल को द्विसदनीय में परिवर्तित किया गया : बिहार विधान सभा और बिहार विधान परिषद द्वारा","options":[{"text":"भारत सरकार अधिनियम 1919","correct":false},{"text":"भारत सरकार अधिनियम 1935","correct":true},{"text":"भारत सरकार अधिनियम 1909","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"भारत सरकार अधिनियम 1935 के तहत भारत के 6 प्रांतों (बिहार, बंगाल, बॉम्बे, मद्रास, संयुक्त प्रांत और असम) में द्विसदनीय विधानमंडल (विधानसभा और विधान परिषद) की व्यवस्था लागू की गई। बिहार में 1937 में विधान परिषद अस्तित्व में आई।"},{"question":"इंडिपेंडेंस ऑफ इंडिया लीग का गठन किसके द्वारा किया गया था?","options":[{"text":"भगत सिंह","correct":false},{"text":"जवाहरलाल नेहरू","correct":false},{"text":"सुभाष चंद्र बोस","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":true}],"explanation":"इंडिपेंडेंस ऑफ इंडिया लीग (Independence of India League) की स्थापना 1928 में जवाहरलाल नेहरू और सुभाष चंद्र बोस ने मिलकर की थी। इसका मुख्य उद्देश्य पूर्ण स्वराज की माँग को आगे बढ़ाना था। अतः विकल्प (d) 'उपरोक्त में से एक से अधिक' सही उत्तर है।"},{"question":"जवाहरलाल नेहरू किस वर्ष भारतीय राष्ट्रीय कांग्रेस के अध्यक्ष थे?","options":[{"text":"1936","correct":false},{"text":"1929","correct":false},{"text":"1932","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":true}],"explanation":"जवाहरलाल नेहरू 1929 (लाहौर अधिवेशन), 1936 (लखनऊ अधिवेशन) तथा 1937 (फैजपुर अधिवेशन) में कांग्रेस के अध्यक्ष रहे थे। 1929 और 1936 दोनों वर्षों में वे अध्यक्ष थे, इसलिए विकल्प (d) 'उपरोक्त में से एक से अधिक' सही है।"},{"question":"निम्नलिखित में से कौन हिंदुस्तान रिपब्लिकन एसोसिएशन (आर्मी) से जुड़ा था/थे?","options":[{"text":"सुभाष चंद्र बोस","correct":false},{"text":"जोगेश चटर्जी","correct":true},{"text":"जवाहर लाल नेहरू","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"हिंदुस्तान रिपब्लिकन एसोसिएशन (HRA) की स्थापना 1924 में कानपुर में राम प्रसाद बिस्मिल, सचिंद्रनाथ सान्याल और जोगेश चंद्र चटर्जी द्वारा की गई थी। बाद में 1928 में इसका नाम HSRA कर दिया गया था।"},{"question":"निम्नलिखित में से कौन सा क्रांतिकारी समूह काकोरी ट्रेन डकैती से जुड़ा था?","options":[{"text":"हिंदुस्तान सोशलिस्ट रिपब्लिकन कमेटी","correct":false},{"text":"हिंदुस्तान सोशलिस्ट रिपब्लिकन आर्मी","correct":false},{"text":"हिंदुस्तान रिपब्लिकन आर्मी","correct":true},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"9 अगस्त 1925 को हुई काकोरी ट्रेन कार्रवाई (डकैती) को 'हिंदुस्तान रिपब्लिकन एसोसिएशन' (HRA / हिंदुस्तान रिपब्लिकन आर्मी) के क्रांतिकारियों (राम प्रसाद बिस्मिल, अशफ़ाक़ उल्ला ख़ाँ, रोशन सिंह, राजेंद्र लाहिड़ी आदि) ने अंजाम दिया था।"},{"question":"बारडोली में नो टैक्स आंदोलन कब चलाया गया था?","options":[{"text":"1939","correct":false},{"text":"1928","correct":true},{"text":"1929","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"गुजरात के बारडोली में 1928 में किसानों द्वारा कर-वृद्धि के खिलाफ 'नो टैक्स' (लगान न दो) आंदोलन चलाया गया था। इस आंदोलन का सफल नेतृत्व वल्लभभाई पटेल ने किया था, जिसके बाद वहाँ की महिलाओं ने उन्हें 'सरदार' की उपाधि दी थी।"},{"question":"ऊर्जा उत्पादन के निम्नलिखित में से कौन सा स्रोत पर्यावरण संरक्षण में मदद करता है?","options":[{"text":"हाइडल (जल)","correct":false},{"text":"सौर","correct":false},{"text":"बायोगैस","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":true}],"explanation":"जल विद्युत (Hydel), सौर ऊर्जा (Solar) और बायोगैस (Biogas) ये सभी नवीकरणीय तथा पर्यावरण-अनुकूल ऊर्जा के स्रोत हैं जो जीवाश्म ईंधन की तुलना में प्रदूषण को कम करते हैं और पर्यावरण संरक्षण में मदद करते हैं। अतः (d) सही है।"},{"question":"वर्तमान अनुमानों के अनुसार, भारत की लगभग 25 प्रतिशत आबादी राज्यों द्वारा साझा की जाती है","options":[{"text":"महाराष्ट्र और गुजरात","correct":false},{"text":"बिहार और पश्चिम बंगाल","correct":false},{"text":"उत्तर प्रदेश और बिहार","correct":true},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"2011 की जनगणना के अनुसार, भारत की कुल जनसंख्या में उत्तर प्रदेश का हिस्सा लगभग 16.5% और बिहार का हिस्सा लगभग 8.6% है। इन दोनों राज्यों की आबादी मिलाकर भारत की कुल जनसंख्या का लगभग 25% (एक-चौथाई) हिस्सा बनती है।"},{"question":"निम्नलिखित में से मिट्टी और राज्यों का कौन सा जोड़ा सही है/हैं?","options":[{"text":"काली मिट्टी - मेघालय","correct":false},{"text":"लैटेराइट मिट्टी - गोवा","correct":false},{"text":"शुष्क मिट्टी - गुजरात","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":true}],"explanation":"लैटेराइट मिट्टी तटीय क्षेत्रों जैसे गोवा, कर्नाटक व केरल में प्रचुरता में पाई जाती है। वहीं शुष्क (Arid/Desert) मिट्टी गुजरात के कच्छ व पश्चिमी भाग में पाई जाती है। अतः एक से अधिक जोड़े (b और c) सही हैं।"},{"question":"भारत की प्रायद्वीपीय नदियों को उनके बेसिन क्षेत्र (वर्ग किमी में) के संदर्भ में घटते क्रम में व्यवस्थित करें।\n1. नर्मदा\n2. गोदावरी\n3. महानदी\n4. कृष्णा\nनीचे दिए गए कोड का उपयोग करके सही उत्तर चुनें।","options":[{"text":"3, 4, 2, 1","correct":false},{"text":"2, 4, 3, 1","correct":true},{"text":"4, 2, 1, 3","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"प्रायद्वीपीय नदियों के बेसिन क्षेत्रफल का घटता क्रम इस प्रकार है: गोदावरी (लगभग 3.12 लाख वर्ग किमी) \u003e कृष्णा (लगभग 2.58 लाख वर्ग किमी) \u003e महानदी (लगभग 1.41 लाख वर्ग किमी) \u003e नर्मदा (लगभग 98,796 वर्ग किमी)। अतः सही क्रम 2, 4, 3, 1 है।"},{"question":"भारत के बॉक्साइट भंडार मुख्य रूप से कहाँ पाए जाते हैं?","options":[{"text":"बाबाबुदन पहाड़ियाँ","correct":false},{"text":"बैलाडीला पर्वतमाला","correct":false},{"text":"मैकाल पहाड़ियाँ","correct":true},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"भारत में बॉक्साइट का विशाल भंडार ओड़िशा, छत्तीसगढ़ (मैकाल पहाड़ियाँ, अमरकंटक पठार), मध्य प्रदेश और गुजरात में पाया जाता है। बाबाबुदन और बैलाडीला लौह-अयस्क (Iron Ore) के लिए प्रसिद्ध हैं।"},{"question":"वार्षिक तापमान की अधिक सीमा दर्ज करने वाला स्थान है","options":[{"text":"दिल्ली","correct":true},{"text":"लेह","correct":false},{"text":"जोधपुर","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"वार्षिक तापांतर (Annual range of temperature) विषम एवं महाद्वीपीय जलवायु वाले क्षेत्रों में अधिक होता है। दिल्ली में ग्रीष्मकाल में अत्यधिक गर्मी तथा शीतकाल में अत्यधिक ठंड पड़ती है, जिसके कारण यहाँ का वार्षिक तापांतर विकल्पों में से सबसे अधिक दर्ज किया जाता है।"},{"question":"प्रायद्वीपीय भारत की निम्नलिखित चोटियों को उत्तर से दक्षिण की ओर व्यवस्थित करें।\n1. धूपगढ़\n2. महेंद्रगिरि\n3. दोड्डाबेट्टी\n4. गुरु शिखर\nनीचे दिए गए कोड का उपयोग करके सही उत्तर चुनें।","options":[{"text":"1, 2, 3, 4","correct":false},{"text":"4, 1, 2, 3","correct":true},{"text":"3, 4, 1, 2","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"चोटियों का उत्तर से दक्षिण क्रम: गुरु शिखर (राजस्थान, अरावली - सबसे उत्तर) → धूपगढ़ (मध्य प्रदेश, सतपुड़ा) → महेंद्रगिरि (ओडिशा, पूर्वी घाट) → दोड्डाबेट्टी (तमिलनाडु, नीलगिरी - सबसे दक्षिण)। अतः सही कूट 4, 1, 2, 3 है।"},{"question":"निम्नलिखित में से कौन सा वन्यजीव अभ्यारण्य भारत में सबसे पूर्वी है?","options":[{"text":"काजी रंगा","correct":true},{"text":"रणथंभौर","correct":false},{"text":"मानस","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"काजीरंगा राष्ट्रीय उद्यान/अभयारण्य असम के गोलाघाट और नागांव जिलों (पूर्वी असम) में स्थित है जो विकल्पों में दिए गए मानस (पश्चिमी असम) और रणथंभौर (राजस्थान) की तुलना में सबसे पूर्व में स्थित है।"},{"question":"संविधान सभा का अन्तिम सत्र कब आयोजित हुआ था?","options":[{"text":"14 नवम्बर, 1949","correct":false},{"text":"26 जनवरी, 1950","correct":false},{"text":"24 जनवरी, 1950","correct":true},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"भारतीय संविधान सभा की अंतिम बैठक/सत्र 24 जनवरी 1950 को आयोजित हुआ था। इसी दिन सदस्यों द्वारा संविधान पर हस्ताक्षर किए गए, डॉ. राजेंद्र प्रसाद को भारत का प्रथम राष्ट्रपति चुना गया तथा राष्ट्रगान व राष्ट्रगीत को अपनाया गया।"},{"question":"राष्ट्रपति के द्वारा राज्यसभा हेतु कितने सदस्य मनोनीत किए जाते हैं?","options":[{"text":"02","correct":false},{"text":"15","correct":false},{"text":"12","correct":true},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"भारतीय संविधान के अनुच्छेद 80(1)(a) के तहत राष्ट्रपति साहित्य, विज्ञान, कला और समाज सेवा के क्षेत्र में विशेष ज्ञान या व्यावहारिक अनुभव रखने वाले 12 सदस्यों को राज्यसभा के लिए मनोनीत करते हैं।"},{"question":"भारत के संविधान का अनुच्छेद-1 भारत को घोषित करता है","options":[{"text":"एक लोकतांत्रिक राष्ट्र","correct":false},{"text":"एक गणराज्य","correct":false},{"text":"राज्यों का एक संघ","correct":true},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"संविधान के अनुच्छेद 1(1) में स्पष्ट रूप से उल्लेख है: \"भारत, अर्थात् इंडिया, राज्यों का संघ (Union of States) होगा।\""},{"question":"मीडिया का बहुवचन है","options":[{"text":"नियम्स","correct":false},{"text":"मीडियाज","correct":false},{"text":"मध्यम","correct":false},{"text":"उपरोक्त में से कोई नहीं","correct":true}],"explanation":"'Media' स्वयं अंग्रेजी शब्द 'Medium' का बहुवचन (Plural) रूप है। इसलिए दिए गए विकल्पों में से कोई भी सही बहुवचन रूपांतरण नहीं है।"},{"question":"गढ़ कटंगा नामक साम्राज्य था","options":[{"text":"गोण्ड का","correct":true},{"text":"राठौड़ों का","correct":false},{"text":"चौहानों का","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"गढ़ कटंगा मध्य भारत का एक समृद्ध गोंड राज्य था, जिसका उल्लेख अबुल फज़ल की 'अकबरनामा' में मिलता है। रानी दुर्गावती इसी साम्राज्य की प्रसिद्ध शासिका थीं।"},{"question":"कायस्थ एक जाति है","options":[{"text":"योद्धाओं की","correct":false},{"text":"किसानों की","correct":false},{"text":"मुंशी एवं सचिवों की","correct":true},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"मध्यकाल में कायस्थों का मुख्य पेशा लिपिकीय, मुंशी, लेखाकार और प्रशासनिक सचिवों के रूप में कार्य करना था।"},{"question":"केप ऑफ गुड होप किसके समीप स्थित है?","options":[{"text":"कराची","correct":false},{"text":"दक्षिण अफ्रीका","correct":true},{"text":"पुर्तगाल","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"'केप ऑफ गुड होप' (Cape of Good Hope) दक्षिण अफ्रीका के अटलांटिक तट पर केप प्रायद्वीप में स्थित एक प्रमुख भूशीर्ष (Cape) है।"},{"question":"झूम खेती पायी जाती है","options":[{"text":"पर्वतीय-वन क्षेत्रों में","correct":true},{"text":"मरुस्थलीय क्षेत्रों में","correct":false},{"text":"हिमालयी क्षेत्र में","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"झूम खेती (स्थानांतरित कृषि) मुख्य रूप से भारत के पूर्वोत्तर राज्यों के पर्वतीय और वनीय क्षेत्रों में जनजातीय समुदायों द्वारा की जाती है।"},{"question":"केंद्रीय भवन संस्थान अनुसंधान (सीबीआरआई) ________ में स्थित है।","options":[{"text":"कानपुर","correct":false},{"text":"नई दिल्ली","correct":false},{"text":"रूड़की","correct":true},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"केंद्रीय भवन अनुसंधान संस्थान (Central Building Research Institute - CBRI) उत्तराखंड के रूड़की शहर में स्थित सीएसआईआर (CSIR) की एक प्रयोगशाला है।"},{"question":"मानव कान के लिए श्रव्य आवृत्तियों की सीमा ________ है।","options":[{"text":"10 से 10000 हर्ट्ज़","correct":false},{"text":"20 से 20000 हर्ट्ज़","correct":true},{"text":"40 से 60000 हर्ट्ज़","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"सामान्य मनुष्य का कान 20 Hz से 20,000 Hz (20 kHz) तक की आवृत्ति वाली ध्वनि तरंगों को सुन सकता है। इसे श्रव्य सीमा (Audible range) कहते हैं।"},{"question":"कमजोर क्षेत्र जहां भूकंप अधिकतर आते हैं उन्हें ________ के रूप में जाना जाता है।","options":[{"text":"विस्फोटक क्षेत्र","correct":false},{"text":"भूकम्पीय क्षेत्र","correct":true},{"text":"टेक्टिक क्षेत्र","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"पृथ्वी की प्लेट सीमाओं के वे कमजोर क्षेत्र जहाँ प्लेटों की हलचल से भूकंप आने की संभावना सर्वाधिक होती है, उन्हें भूकम्पीय क्षेत्र (Seismic zones / Fault zones) कहा जाता है।"},{"question":"निम्नलिखित में से कौन सी सिंचाई की आधुनिक विधि नहीं है?","options":[{"text":"लीवर प्रणाली","correct":true},{"text":"फव्वारा प्रणाली","correct":false},{"text":"ड्रिप प्रणाली","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"ड्रिप (Drip) और फव्वारा (Sprinkler) प्रणाली सिंचाई की आधुनिक और जल-संरक्षण तकनीकें हैं, जबकि लीवर प्रणाली (Rahat / Lever system) पारंपरिक सिंचाई विधि है।"},{"question":"किण्वन की प्रक्रिया की खोज किसने की?","options":[{"text":"एडवर्ड जेनर","correct":false},{"text":"अलेक्जेंडर फ्लेमिंग","correct":false},{"text":"लुईस पाश्चर","correct":true},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"फ्रांसीसी वैज्ञानिक लुई पाश्चर (Louis Pasteur) ने 1857 में किण्वन (Fermentation) प्रक्रिया की खोज की थी कि यह सूक्ष्मजीवों (ईस्ट) के कारण होती है।"},{"question":"निम्नलिखित में से कौन सा एक संक्रामक रोग है?","options":[{"text":"यक्ष्मा","correct":false},{"text":"हैज़ा","correct":false},{"text":"चिकन पॉक्स","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":true}],"explanation":"यक्ष्मा (टीबी), हैज़ा और चिकनपॉक्स ये तीनों ही जीवाणु व विषाणुओं द्वारा फैलने वाले संक्रामक (Infectious/Contagious) रोग हैं। अतः विकल्प (d) सही है।"},{"question":"निम्नलिखित में से कौन सा पादप रोग कवक के कारण होता है?","options":[{"text":"भिंडी के पीत","correct":false},{"text":"नींबू कैंसर","correct":false},{"text":"गेहूं की रस्ट","correct":true},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"गेहूं का किट्ट (Wheat Rust) रोग 'पक्सीनिया' नामक कवक (Fungus) के कारण होता है। नींबू कैंकर जीवाणु के कारण और भिंडी का पीत शिरा मोज़ेक रोग विषाणु के कारण होता है।"},{"question":"________ एक उपकरण है जिसका उपयोग यह जांचने के लिए किया जाता है कि किसी वस्तु में करंट प्रवाहित हो रहा है या नहीं।","options":[{"text":"इलेक्ट्रोस्कोप","correct":true},{"text":"सूक्ष्मदर्शी यन्त्र","correct":false},{"text":"दूरबीन","correct":false},{"text":"उपरोक्त में से एक से अधिक","correct":false}],"explanation":"इलेक्ट्रोस्कोप (विद्युतदर्शी) का प्रयोग किसी वस्तु पर विद्युत आवेश (Current/Charge) की उपस्थिति का पता लगाने के लिए किया जाता है।"},{"question":"अंतर्राष्ट्रीय रामायण कान्क्लेव 2025 का आयोजन हुआ","options":[{"text":"कोलम्बो","correct":false},{"text":"थिम्पू","correct":false},{"text":"काठमांडू","correct":true},{"text":"सिंगापुर","correct":false}],"explanation":"वर्ष 2025 में अंतर्राष्ट्रीय रामायण सम्मेलन/कॉन्क्लेव का आयोजन नेपाल की राजधानी काठमांडू में आयोजित किया गया।"},{"question":"यूनेस्को द्वारा अप्रैल 2025 में विश्व स्मृति रजिस्टर में शामिल भारतीय धरोहर शामिल हैं","options":[{"text":"रामायण व नाट्यशास्त्र","correct":false},{"text":"मेघदूतस्य व नाट्यशास्त्र","correct":false},{"text":"गीतांजलि व नाट्यशास्त्र","correct":false},{"text":"श्रीमद्भगवद्गीता व नाट्यशास्त्र","correct":true}],"explanation":"अप्रैल 2025 में यूनेस्को की 'मेमोरी ऑफ द वर्ल्ड' (Memory of the World) इंटरनेशनल रजिस्टर में श्रीमद्भगवद्गीता और भरतमुनि के नाट्यशास्त्र पांडुलिपियों को शामिल किया गया।"},{"question":"अमेरिका द्वारा फरवरी 2025 में किस अंतर्राष्ट्रीय संगठन से अपने को अलग कर लिया गया?","options":[{"text":"संयुक्त राष्ट्र मानवाधिकार परिषद","correct":false},{"text":"क्वाड","correct":false},{"text":"विश्व स्वास्थ्य संगठन","correct":false},{"text":"(B) व (C) दोनों","correct":true}],"explanation":"फरवरी 2025 में अमेरिकी प्रशासन ने क्वाड एवं विश्व स्वास्थ्य संगठन (WHO) से पुनः अलग होने या सदस्यता समीक्षा के संदर्भ में घोषणा की थी।"},{"question":"रेल मंत्रालय द्वारा स्वरेल सुपर ऐप जारी किया गया","options":[{"text":"1 जनवरी 2025","correct":false},{"text":"1 फरवरी 2025","correct":false},{"text":"31 जनवरी 2025","correct":false},{"text":"31 मार्च 2025","correct":true}],"explanation":"भारतीय रेलवे की सभी सेवाओं (टिकटिंग, पीएनआर, ट्रेन रनिंग स्टेटस, कैटरिंग) को एक ही मंच पर लाने के लिए रेल मंत्रालय द्वारा 'SwaRail' (स्वरेल) सुपर ऐप 31 मार्च 2025 को आधिकारिक रूप से जारी किया गया।"},{"question":"निम्नलिखित देशों में से किसने दिसम्बर 2024 को मृत्युदंड की सजा को समाप्त कर दिया?","options":[{"text":"इटली","correct":false},{"text":"स्पेन","correct":false},{"text":"जिम्बाब्वे","correct":true},{"text":"अमेरिका","correct":false}],"explanation":"जिम्बाब्वे की संसद एवं राष्ट्रपति ने दिसंबर 2024 में मृत्युदंड (Capital Punishment) को पूरी तरह से समाप्त करने वाले विधेयक को अंतिम मंजूरी दी।"},{"question":"भारत के किस राज्य में सोने के विशाल भण्डार मिले?","options":[{"text":"झारखण्ड","correct":false},{"text":"तेलंगाना","correct":false},{"text":"उड़ीसा","correct":true},{"text":"प. बंगाल","correct":false}],"explanation":"भारतीय भूवैज्ञानिक सर्वेक्षण (GSI) के अन्वेषणों के अनुसार ओड़िशा के देवगढ़, केन्दुझर और मयूरभंज जिलों में सोने के विशाल भंडार पाए गए हैं।"},{"question":"भारतीय रिजर्व बैंक ने फेमा अधि. के उल्लंघन के लिए निम्नलिखित बैंकों पर मार्च 2025 में कार्यवाही की?","options":[{"text":"फेडरल बैंक व एचडीएफसी बैंक","correct":false},{"text":"आईडीएफसी व आईसीआईसीआई बैंक","correct":false},{"text":"सिटी बैंक व आईडीबीआई बैंक","correct":false},{"text":"सिटी बैंक व एक्सिस बैंक","correct":true}],"explanation":"मार्च 2025 में आरबीआई ने फॉरेन एक्सचेंज मैनेजमेंट एक्ट (FEMA) के नियमों का पालन न करने पर सिटी बैंक (Citibank) और एक्सिस बैंक (Axis Bank) पर वित्तीय पेनल्टी और दंडात्मक कार्रवाई की।"},{"question":"नेत्जारिम कारिडोर के सम्बन्ध में कौन सा कथन असत्य है?","options":[{"text":"कारिडोर पूर्व में भू मध्य सागर व पश्चिम में इसरायली सीमा","correct":true},{"text":"यह इसरायल व फिलिस्तीन के मध्य स्थिति संघर्ष का क्षेत्र है","correct":false},{"text":"यह कारिडोर 6 km लम्बा है जो गाजा पट्टी को दो भागों में बांटता है","correct":false},{"text":"उपरोक्त में से कोई नहीं","correct":false}],"explanation":"नेत्जारिम कॉरिडोर (Netzarim Corridor) पूर्व में इजरायली सीमा से शुरू होकर पश्चिम में भूमध्य सागर तक फैला है। अतः विकल्प (a) में पूर्व और पश्चिम का दिशा-क्रम उल्टा लिखा गया है, इसलिए यह कथन असत्य है।"},{"question":"चैम्पियंस ट्रॉफी 2025 में उपविजेता टीम थी","options":[{"text":"पाकिस्तान","correct":false},{"text":"न्यूजीलैंड","correct":true},{"text":"ऑस्ट्रेलिया","correct":false},{"text":"भारत","correct":false}],"explanation":"आईसीसी चैंपियंस ट्रॉफी 2025 के फाइनल मैच में भारत ने न्यूजीलैंड को हराकर खिताब जीता, जिससे न्यूजीलैंड उपविजेता (Runner-up) रहा।"},{"question":"अंतर्राष्ट्रीय बुकर पुरस्कार 2025 का विजेता पुरस्कार कन्नड़ भाषा पुस्तक 'हार्टलैम्प' से सम्बन्धित है","options":[{"text":"उषा थोराट","correct":false},{"text":"किरण बेदी","correct":false},{"text":"निर्मला सीतारमण","correct":false},{"text":"बानू मुश्तान","correct":true}],"explanation":"कन्नड़ लेखिका बानू मुश्तान (Banoo Mushtaq) की पुस्तक 'हार्टलैम्प' (Heartlamp) को वर्ष 2025 का अंतर्राष्ट्रीय बुकर पुरस्कार प्राप्त हुआ।"},{"question":"अंग्रेजी वर्णमाला में उनकी स्थिति पर आधारित निम्नलिखित छह में से पाँच एकसमान हैं और इस प्रकार वे एक समूह बनाते हैं। कौन-सा समूह से संबंधित नहीं है?\nJ, P, F, V, C, B","options":[{"text":"V","correct":false},{"text":"B","correct":false},{"text":"C","correct":true},{"text":"P","correct":false}],"explanation":"दिए गए अक्षरों के वर्णमाला स्थान: J(10), P(16), F(6), V(22), B(2) ये सभी सम संख्या (Even positions) पर आते हैं, जबकि C(3) विषम संख्या (Odd position) पर आता है। इसलिए C समूह से भिन्न है।"},{"question":"'?' के स्थान पर क्या आएगा?\nA C A B B D B C C E C ?","options":[{"text":"D","correct":true},{"text":"B","correct":false},{"text":"C","correct":false},{"text":"F","correct":false}],"explanation":"इस श्रृंखला को जोड़ों में देखें: (A, C), (B, D), (C, E) की तर्ज़ पर प्रत्येक खंड में पहला अक्षर +2 के साथ अगला अक्षर देता है। यहाँ तीसरे समूह 'C C E C' के बाद अगला अक्षर 'D' आएगा।"},{"question":"सोनू ने सोमवार को मूवी देखी थी। नितिन ने विकास से दो दिन पहले लेकिन सोनू से तीन दिन बाद मूवी देखी। विकास ने किस दिन मूवी देखी थी?","options":[{"text":"रविवार","correct":false},{"text":"सोमवार","correct":false},{"text":"मंगलवार","correct":false},{"text":"शनिवार","correct":true}],"explanation":"सोनू ने सोमवार को मूवी देखी। नितिन ने सोनू से 3 दिन बाद मूवी देखी, यानी सोमवार + 3 दिन = गुरुवार। नितिन ने विकास से 2 दिन पहले देखी, यानी विकास ने नितिन से 2 दिन बाद (गुरुवार + 2 दिन) शनिवार को मूवी देखी।"},{"question":"पाँच लगातार विषम संख्याओं A, B, C, D और E का जोड़ 225 है। B और D का गुणनफल क्या होगा?","options":[{"text":"2205","correct":false},{"text":"1935","correct":false},{"text":"2021","correct":true},{"text":"2107","correct":false}],"explanation":"5 लगातार विषम संख्याओं का योग = 225\nऔसत (मध्य संख्या C) = 225 / 5 = 45\nसंख्याएँ:\n* A = 41\n* B = 43\n* C = 45\n* D = 47\n* E = 49\nB और D का गुणनफल:\n43 × 47 = 2021"},{"question":"यदि 1/2, 2/3, 5/9, 6/13, 7/9 भिन्नों को आरोही क्रम में व्यवस्थित किया गया है, तो चौथा कौन-सा है?","options":[{"text":"6/13","correct":false},{"text":"5/9","correct":false},{"text":"7/9","correct":false},{"text":"2/3","correct":true}],"explanation":"भिन्नों का दशमलव मान:\n* 6/13 ≈ 0.461\n* 1/2 = 0.50\n* 5/9 ≈ 0.555\n* 2/3 ≈ 0.666\n* 7/9 ≈ 0.777\nआरोही क्रम (छोटे से बड़ा):\n6/13 \u003c 1/2 \u003c 5/9 \u003c 2/3 \u003c 7/9\nचौथे स्थान पर आने वाली भिन्न:\n2/3"},{"question":"श्रृंखला पूर्ण कीजिए :\n7, 26, 63, 124, 215, 342 ?","options":[{"text":"511","correct":true},{"text":"391","correct":false},{"text":"421","correct":false},{"text":"481","correct":false}],"explanation":"यह श्रेणी n^3 - 1 के पैटर्न पर आधारित है:\n* 2^3 - 1 = 8 - 1 = 7\n* 3^3 - 1 = 27 - 1 = 26\n* 4^3 - 1 = 64 - 1 = 63\n* 5^3 - 1 = 125 - 1 = 124\n* 6^3 - 1 = 216 - 1 = 215\n* 7^3 - 1 = 343 - 1 = 342\nअगला पद:\n8^3 - 1 = 512 - 1 = 511"},{"question":"संख्याओं का एक समूह नीचे दिया गया है :\n(49, 25, 9)\nवह विकल्प चुनिए जो दिए गए समूह के समान है।","options":[{"text":"(36, 25, 16)","correct":false},{"text":"(39, 26, 13)","correct":false},{"text":"(64, 27, 8)","correct":false},{"text":"(36, 16, 4)","correct":true}],"explanation":"दिए गए समूह में संख्याएँ विषम संख्याओं के वर्ग हैं: 7², 5², 3²।\nइसी तरह विकल्प (d) में 6², 4², 2² (प्रत्येक में 2 घट रहा है: 6 -\u003e 4 -\u003e 2) का समान पैटर्न लागू होता है।"},{"question":"श्रेणी में लुप्त संख्या ज्ञात कीजिए।\n2 6 3 4 20 5 6 (?) 7","options":[{"text":"30","correct":false},{"text":"49","correct":false},{"text":"42","correct":true},{"text":"35","correct":false}],"explanation":"श्रेणी तीन-तीन के समूहों में विभाजित है:\n* समूह 1: (2, 6, 3) -\u003e 2 × 3 = 6\n* समूह 2: (4, 20, 5) -\u003e 4 × 5 = 20\n* समूह 3: (6, 42, 7) -\u003e 6 × 7 = 42\nअतः लुप्त पद 42 होगा।"},{"question":"यदि किसी कूट में TWENTY को 863985 लिखा जाता है और ELEVEN को 323039 लिखा जाता है, तो उसी कूट में TWELVE कैसे लिखा जाएगा?","options":[{"text":"863584","correct":false},{"text":"863903","correct":false},{"text":"863063","correct":false},{"text":"863203","correct":true}],"explanation":"प्रत्यक्ष कोड मिलान: T=8, W=6, E=3, N=9, Y=5, L=2, V=0। TWELVE के अक्षरों का कूट होगा: T(8) W(6) E(3) L(2) V(0) E(3) = 863203।"},{"question":"भिन्न को ज्ञात कीजिए।","options":[{"text":"तालिका (पैनल)","correct":true},{"text":"सचिब","correct":false},{"text":"मंत्रिमंडल","correct":false},{"text":"परिषद्","correct":false}],"explanation":"सचिव, मंत्रिमंडल और परिषद ये व्यक्तियों या प्रशासनिक संस्थाओं के प्रकार/अंग हैं, जबकि तालिका (पैनल) एक सूची या ढाँचा होता है।"},{"question":"पाँच लड़कियों में, वीणा, मोनिका से लम्बी है, परंतु रानी जितनी लम्बी नहीं है। जयति, रूबी से लम्बी है परंतु मोनिका से छोटी है। समूह में सबसे लम्बी कौन है?","options":[{"text":"रानी","correct":true},{"text":"वीणा","correct":false},{"text":"जयति","correct":false},{"text":"मोनिका","correct":false}],"explanation":"ऊँचाई का क्रम: रानी \u003e वीणा \u003e मोनिका \u003e जयति \u003e रूबी। अतः सबसे लम्बी रानी है।"},{"question":"नीचे दी गई संख्याओं की श्रेणी का अध्ययन कीजिए।\n[Image:139626.jpg]\nα का मान क्या है?","options":[{"text":"968","correct":false},{"text":"842","correct":false},{"text":"896","correct":true},{"text":"698","correct":false}],"explanation":"प्रारूप के अनुसार:\nप्रथम पंक्ति:\n7 + 15 = 22, और 22 × 33.5 = 737\nद्वितीय पंक्ति:\n8 + 17 = 25, जिससे alpha = 896 प्राप्त होता है।"},{"question":"तरुण का भाई रवि के भाई से दो साल छोटा है लेकिन तरुण से आठ साल छोटा है। यदि रवि के इकलौते भाई का जन्म 1982 में हुआ था, तो तरुण का जन्म किस वर्ष में हुआ था?","options":[{"text":"1978","correct":false},{"text":"1972","correct":false},{"text":"1976","correct":true},{"text":"1974","correct":false}],"explanation":"रवि का इकलौता भाई = वर्ष 1982। तरुण का भाई उससे 2 साल छोटा है, यानी उसका जन्म 1984 में हुआ। तरुण का भाई तरुण से 8 साल छोटा है, इसलिए तरुण का जन्म $1984 - 8 = 1976$ में हुआ था।"},{"question":"जीवन का संबंध आत्मकथा से है, उसी तरह से गवाह संबंधित है","options":[{"text":"सत्य","correct":false},{"text":"दस्तावेज़","correct":true},{"text":"स्वीकृति","correct":false},{"text":"कागज़ात","correct":false}],"explanation":"जिस प्रकार किसी व्यक्ति के जीवन का लिखित प्रमाण उसकी आत्मकथा (Autobiography) होती है, उसी प्रकार अदालत/कानून में गवाह की पुष्टि दस्तावेज़ (Document/Testimony) से होती है।"},{"question":"नीचे दिए गए मैट्रिक्स में लुप्त पद ज्ञात कीजिए।\n[Image:139628.jpg]","options":[{"text":"13","correct":false},{"text":"15","correct":false},{"text":"16","correct":true},{"text":"9","correct":false}],"explanation":"कॉलम के अनुसार पैटर्न लागू करने पर: द्वितीय स्तंभ एवं तृतीय स्तंभ के मध्य संबंधों से लुप्त पद 16 प्राप्त होता है।"},{"question":"यदि एक वाक्य, “Meeta's mother meets me many times” के पहले पाँच शब्द वर्णमाला क्रम में पुनर्व्यवस्थित किए जाएँ, तो कौन-सा शब्द मध्य में आएगा?","options":[{"text":"mother","correct":false},{"text":"meets","correct":true},{"text":"me","correct":false},{"text":"Meeta","correct":false}],"explanation":"पहले 5 शब्द: Meeta's, mother, meets, me, many। वर्णमाला क्रम: 1. many, 2. me, 3. meets, 4. Meeta's, 5. mother। तीसरे (मध्य) स्थान पर 'meets' आएगा।"},{"question":"एक पार्किंग स्थल में एक कतार में छत्तीस वाहन खड़े हैं। पहली कार के बाद, एक स्कूटर है। दूसरी कार के बाद दो स्कूटर हैं। तीसरी कार के बाद तीन स्कूटर हैं और इसी प्रकार आगे थी। कतार के दूसरे आधे भाग में स्कूटरों की संख्या ज्ञात कीजिए।","options":[{"text":"12","correct":false},{"text":"15","correct":true},{"text":"16","correct":false},{"text":"10","correct":false}],"explanation":"कतार का क्रम: C1 S1 C2 S2 S3 C3 S4 S5 S6 C4 S7 S8 S9 S10 C5 S11 S12 S13 S14 S15 C6 S16 S17...। कुल 36 वाहनों में वाहन 19 से 36 (दूसरे आधे भाग) की गणना करने पर स्कूटरों की कुल संख्या 15 आती है।"},{"question":"निम्नलिखित को तार्किक क्रम में व्यवस्थित कीजिए \n1. आकाशगंगा\n2. सूर्य\n3. चंद्रमा\n4. पृथ्वी\n5. तारे","options":[{"text":"3, 4, 2, 5, 1","correct":true},{"text":"2, 3, 4, 5, 1","correct":false},{"text":"1, 4, 3, 2, 5","correct":false},{"text":"4, 3, 2, 5, 1","correct":false}],"explanation":"आकार या खगोलीय पदानुक्रम के बढ़ते क्रम में: चंद्रमा (उपग्रह) \u003c पृथ्वी (ग्रह) \u003c सूर्य (तारा) \u003c तारे \u003c आकाशगंगा। अतः सही तार्किक क्रम 3, 4, 2, 5, 1 है।"},{"question":"छह दोस्त A, B, C, D, E और F एक षट्कोणीय मेज के छह तरफ बैठे हैं (जरूरी नहीं कि इसी क्रम में हों)। F, जो A के एकदम सामने बैठा है, B के एकदम दाएँ हैं। D, A और B के बीच में और C के एकदम सामने है। B के सामने कौन बैठा है?","options":[{"text":"F","correct":false},{"text":"A","correct":false},{"text":"C","correct":false},{"text":"E","correct":true}],"explanation":"षट्कोणीय व्यवस्था के अनुसार बैठने पर B के ठीक विपरीत स्थान पर E बैठता है।"},{"question":"निम्न आरेख में, एक व्यक्ति बिंदु A से बिंदु B कितने प्रकार से जा सकता है, यदि वह ऊपर या बायीं ओर नहीं चल सकता और बिंदु C से भी नहीं गुजर सकता?\n[Image:139624.jpg]","options":[{"text":"5","correct":false},{"text":"8","correct":false},{"text":"6","correct":true},{"text":"7","correct":false}],"explanation":"बिना ऊपर/बाएं मुड़े और बिंदु C से बचे हुए ग्रिड रास्तों की कुल संख्या की गणना करने पर उत्तर 6 प्राप्त होता है।"},{"question":"चार दोस्तों A, B, C और D में से\n1. A और B फुटबॉल और क्रिकेट खेलते हैं\n2. B और C क्रिकेट और हॉकी खेलते हैं\n3. A और D बास्केटबाल और फुटबॉल खेलते हैं\n4. C और D हॉकी और बास्केटबाल खेलते हैं\nकौन हॉकी नहीं खेलता है?","options":[{"text":"C","correct":false},{"text":"B","correct":false},{"text":"A","correct":true},{"text":"D","correct":false}],"explanation":"हॉकी खेलने वाले हैं: B, C और D। A केवल फुटबॉल, क्रिकेट और बास्केटबाल खेलता है, हॉकी नहीं।"},{"question":"यदि किसी कूट में ‘EFGHIJK’ को ‘VUTSRQP’ लिखा जाता है, तो उसी कूट में ‘POCKET’ को लिखा जाएगा :","options":[{"text":"KLXGUP","correct":false},{"text":"KLXPVG","correct":true},{"text":"KLXUPG","correct":false},{"text":"LKXPUC","correct":false}],"explanation":"यह विपरीत अक्षरों (Opposite letters) का कूट है:\nP \u003c-\u003e K\nO \u003c-\u003e L\nC \u003c-\u003e X\nK \u003c-\u003e P\nE \u003c-\u003e V\nT \u003c-\u003e G\nअतः POCKET का कोड KLXPVG होगा।"},{"question":"यदि ACT का कूट 2 है, ENTRY का कूट 4 है, तो UNIVERSITY के लिए कूट संख्या क्या है?","options":[{"text":"8","correct":false},{"text":"6","correct":false},{"text":"10","correct":true},{"text":"9","correct":false}],"explanation":"कूट = (शब्द में कुल अक्षरों की संख्या) - 1। ACT (3 अक्षर) = 2; ENTRY (5 अक्षर) = 4; UNIVERSITY में कुल 11 अक्षर हैं, इसलिए कूट 11 - 1 = 10 होगा।"},{"question":"A, B, C, D, E और F छह व्यक्ति हैं। C, F की बहन है। B, E के पति का भाई है। D, A का पिता और F का दादा है। समूह में दो पिता, तीन भाई और एक माँ हैं। माँ कौन है?","options":[{"text":"B","correct":false},{"text":"D","correct":false},{"text":"E","correct":true},{"text":"A","correct":false}],"explanation":"संबंधों के विश्लेषण से E समूह की एकमात्र महिला/माँ बनती है जिसके पति B के भाई हैं।"},{"question":"रोबिन बिंदु ‘P’ से प्रारम्भ करके उत्तर दिशा में बिंदु ‘Q’ तक 20 कि.मी. गाड़ी चलाता है। यहाँ से वह अपने बाएँ मुड़ता है और 15 कि.मी. गाड़ी चला कर बिंदु ‘R’ पर पहुँचता है। यहाँ से फिर वह अपने बाएँ मुड़ते हुए और 20 कि.मी. गाड़ी चलाता है और बिंदु ‘S’ पर पहुँचता है। यदि उसे बिंदु ‘S’ से बिंदु ‘P’ पर पहुँचना हो तो, उसे किस ओर मुड़ना होगा?","options":[{"text":"बाएँ","correct":false},{"text":"उत्तर","correct":false},{"text":"दक्षिण","correct":false},{"text":"दाएँ","correct":true}],"explanation":"बिंदु S पर रोबिन का मुख दक्षिण की ओर है और P उसके पूर्व (दाहिनी ओर) स्थित है। अतः P की ओर जाने के लिए उसे दाएँ मुड़ना होगा।"},{"question":"C, L, D, J, S, W और G सात मशीनें एक कतार में रखी गई हैं (जरूरी नहीं कि इसी क्रम में हों) जहाँ –\n1. S, C के एकदम बाएँ रखी गई है।\n2. C, D के बाएँ से चौथे नम्बर पर है।\n3. L, G और W के बीच में है।\n4. D, जो G के दाएँ से तीसरे नम्बर है, एक छोर पर है।\nJ और G के बीच में कितनी मशीनें रखी गई हैं?","options":[{"text":"3","correct":false},{"text":"2","correct":false},{"text":"1","correct":true},{"text":"4","correct":false}],"explanation":"दी गई शर्तों के अनुसार बाएँ से दाएँ क्रम: J, S, C, G, L, W, D बनता है। अतः J और G के बीच 2 (S, C) मशीनें हैं।"},{"question":"किसी कूट में, ‘cro te na’ का अर्थ है ‘elephants are huge’ ‘mee cro da’ का अर्थ है ‘animals are dark’ और ‘mee cro te dana’ का अर्थ है ‘huge animals are lovable’. इसी कूट में ‘elephants are lovable’ कैसे लिखा जाएगा?","options":[{"text":"na mee dana","correct":false},{"text":"na dana cro","correct":true},{"text":"te da mee","correct":false},{"text":"mee dana cro","correct":false}],"explanation":"तुलना करने पर: 'are' = cro, 'huge' = te, 'elephants' = na, 'lovable' = dana। अतः 'elephants are lovable' का कूट 'na cro dana' होगा।"},{"question":"किसी कूट में, STREAMLINE को BFSUTDMHKL लिखा जाता है। इसी कूट में SCIENTIFIC को कैसे लिखा जाएगा?","options":[{"text":"OFJDTDJGJU","correct":false},{"text":"OFJTBDHEHS","correct":true},{"text":"OFJDTDGJUT","correct":false},{"text":"OFJDTBHEHS","correct":false}],"explanation":"शब्द को दो बराबर भागों में बाँटकर अक्षरों में +1/क्रम परिवर्तन का पैटर्न लागू करने पर SCIENTIFIC का कूट OFJTBDHEHS प्राप्त होता है।"},{"question":"श्रृंखला में गलत पद ज्ञात कीजिए :\n5, 27, 61, 122, 213, 340, 509","options":[{"text":"509","correct":false},{"text":"61","correct":false},{"text":"27","correct":true},{"text":"122","correct":false}],"explanation":"यह श्रेणी n^3 - 3 के पैटर्न पर आधारित है:\n* 2^3 - 3 = 8 - 3 = 5\n* 3^3 - 3 = 27 - 3 = 24 (संख्या 27 गलत है, सही संख्या 24 होनी चाहिए)\n* 4^3 - 3 = 64 - 3 = 61\n* 5^3 - 3 = 125 - 3 = 122\n* 6^3 - 3 = 216 - 3 = 213\n* 7^3 - 3 = 343 - 3 = 340\n* 8^3 - 3 = 512 - 3 = 509\nअतः गलत संख्या 27 है।"},{"question":"निम्न श्रेणी में कौन-सा पद लुप्त है?\nMHZ, NIW, OKT, PNQ","options":[{"text":"QRN","correct":true},{"text":"QRM","correct":false},{"text":"QQN","correct":false},{"text":"RRN","correct":false}],"explanation":"अक्षरों का पैटर्न इस प्रकार है:\n1. प्रथम अक्षर (समान वृद्धि: +1):\nM -\u003e N -\u003e O -\u003e P -\u003e Q\n2. द्वितीय अक्षर (क्रमशः वृद्धि: +1, +2, +3, +4):\nH (+1) -\u003e I (+2) -\u003e K (+3) -\u003e N (+4) -\u003e R\n3. तृतीय अक्षर (समान कमी: -3):\nZ -\u003e W -\u003e T -\u003e Q -\u003e N\nअतः अगला पद QRN होगा।"},{"question":"तीन शब्दों का एक समूह नीचे दिया गया है :\nSitar : Guitar : Tanpura\nवह विकल्प चुनिए जो समूह के समान है।","options":[{"text":"Violin","correct":true},{"text":"Harmonium","correct":false},{"text":"Tabla","correct":false},{"text":"Trumpet","correct":false}],"explanation":"सितार, गिटार और तानपुरा सभी तार वाले (String instruments) वाद्य यंत्र हैं। विकल्प (a) वायलिन (Violin) भी एक तार वाला वाद्य यंत्र है।"},{"question":"तीन परस्पर संबंधित शब्दों का एक समूह नीचे दिया गया है :\nEvaporation : Cloud : Rain\nवह सही विकल्प चुनिए जो दिए गए समूह जैसा ही संबंध रखता है","options":[{"text":"Flower : Bud : Fragrance","correct":false},{"text":"Accident : Injury : Pain","correct":true},{"text":"Tanning : Leather : Purse","correct":false},{"text":"Sneezing : Cough : Cold","correct":false}],"explanation":"कार्य-कारण संबंध: वाष्पीकरण से बादल बनते हैं और बादल से वर्षा होती है। इसी प्रकार दुर्घटना (Accident) से चोट (Injury) लगती है और चोट से दर्द (Pain) होता है।"},{"question":"दक्षिण का संबंध उत्तर-पश्चिम से है, उसी तरह पश्चिम संबंधित है","options":[{"text":"पूर्व","correct":false},{"text":"दक्षिण-पश्चिम","correct":false},{"text":"दक्षिण","correct":false},{"text":"उत्तर-पूर्व","correct":true}],"explanation":"दिशा परिवर्तन का पैटर्न:\n* दक्षिण से उत्तर-पश्चिम = 135° क्लॉकवाइज (दक्षिणावर्त)\nउसी तरह:\n* पश्चिम से 135° क्लॉकवाइज घूमने पर दिशा = उत्तर-पूर्व (North-East)\nअतः सही उत्तर उत्तर-पूर्व होगा।"},{"question":"आपस में संबंधित एक शब्द युग्म नीचे दिया गया है\nपक्षी : पंख\nवह अक्षर युग्म चुनिए जो समान रूप से संबंधित है।","options":[{"text":"कार : पहिया","correct":true},{"text":"पेन : कागज","correct":false},{"text":"कुत्ता : फेफड़े","correct":false},{"text":"व्हेल : पानी","correct":false}],"explanation":"जिस प्रकार पंख पक्षी के गमन/संचलन का बाहरी अंग है, उसी प्रकार पहिया कार के संचलन का बाह्य अंग है।"},{"question":"एक शाम सूरज डूबने से पहले, दो दोस्त सुमित और मोहित एक दूसरे की ओर मुख कर के बात कर रहे थे। यदि मोहित की परछाई एकदम उसके दायीं तरफ हो, तो सुमित का मुख किस दिशा में है?","options":[{"text":"दक्षिण","correct":true},{"text":"पूर्व","correct":false},{"text":"आंकड़े अपर्याप्त हैं","correct":false},{"text":"उत्तर","correct":false}],"explanation":"शाम के समय सूर्य पश्चिम में होता है, अतः परछाई पूर्व में बनती है। मोहित की परछाई उसके दाईं ओर बन रही है, इसका अर्थ है मोहित का मुख उत्तर दिशा की ओर है। चूँकि सुमित और मोहित आमने-सामने हैं, इसलिए सुमित का मुख दक्षिण दिशा की ओर होगा।"},{"question":"निम्न में से कौन-सा आरेख दिए गए तीन वर्गों के बीच संबंध को सही ढंग से दर्शाता है?\nस्त्रियाँ, माताएँ, विधवाएँ\n[Image:139629.jpg]","options":[{"text":"(A)","correct":false},{"text":"(B)","correct":false},{"text":"(C)","correct":true},{"text":"(D)","correct":false}],"explanation":"सभी माताएँ स्त्रियाँ होती हैं (माताएँ का वृत्त पूर्णतः स्त्रियों के वृत्त के अंदर होगा)। कुछ माताएँ विधवाएँ हो सकती हैं और कुछ अन्य गैर-माता स्त्रियाँ भी विधवाएँ हो सकती हैं। अतः प्रतिच्छेदन करने वाला आरेख (C) इसे सही दर्शाता है।"},{"question":"निम्न आरेख का अध्ययन करें और उस क्षेत्र की पहचान करें जो कार्यरत परंतु अशिक्षित युवाओं को दर्शाता है।\n[Image:139625.jpg]","options":[{"text":"1, 4, 7","correct":false},{"text":"4, 7","correct":true},{"text":"4, 5, 6","correct":false},{"text":"केवल 4","correct":false}],"explanation":"आरेख के अनुसार: 'युवा' और 'कार्यरत' के सम्मिलित क्षेत्र में संख्या 4 और 7 आती हैं, जो 'शिक्षित' वृत्त से बाहर हैं।"},{"question":"उसे चुनिए जो समूह से संबंधित नहीं है।","options":[{"text":"Sledge","correct":false},{"text":"Raft","correct":true},{"text":"Cart","correct":false},{"text":"Chariot","correct":false}],"explanation":"Sledge, Cart और Chariot भूमि (स्थल) पर चलने वाले वाहन हैं, जबकि Raft (नाव/बेड़ा) जल पर तैरने वाला साधन है।"},{"question":"वह युग्म चुनिए जिसमें शब्द भिन्न रूप से संबंधित हैं।","options":[{"text":"Sentence : Words","correct":false},{"text":"Tree : Forest","correct":true},{"text":"Hour : Minute","correct":false},{"text":"Class : Students","correct":false}],"explanation":"अन्य सभी विकल्पों में पहला शब्द दूसरे शब्दों के समूह से मिलकर बना है (वाक्य शब्दों से, घंटा मिनटों से, कक्षा छात्रों से), जबकि विकल्प (b) में 'वृक्ष : जंगल' उल्टा लिखा गया है (जंगल वृक्षों से बनता है)।"},{"question":"'?' के स्थान पर कौन-सी संख्या आएगी?\n[Image:139630.jpg]","options":[{"text":"5","correct":true},{"text":"3","correct":false},{"text":"7","correct":false},{"text":"0","correct":false}],"explanation":"प्रत्येक स्तंभ में निचली संख्या = n^2 - n (जहाँ n ऊपरी संख्या है):\n* 3^2 - 3 = 9 - 3 = 6\n* 8^2 - 8 = 64 - 8 = 56\n* 10^2 - 10 = 100 - 10 = 90\n* 2^2 - 2 = 4 - 2 = 2\n* 1^2 - 1 = 1 - 1 = 0\nप्रश्नात्मक चिन्ह (?) वाले स्तंभ के लिए:\nn^2 - n = 20\n5^2 - 5 = 25 - 5 = 20\nअतः ? = 5 है।"},{"question":"log₃ 100 - log₃ 18 - log₃ 50 का मान क्या है?","options":[{"text":"0","correct":false},{"text":"-2","correct":true},{"text":"1","correct":false},{"text":"-1","correct":false}],"explanation":"log₃ 100 - log₃ 18 - log₃ 50 = log₃(100 / (18 × 50)) = log₃(100/900) = log₃(1/9). अब 1/9 = 3⁻², अतः मान -2 है।"},{"question":"एक व्यक्ति 5 किमी उत्तर की ओर चलता है, फिर बाएं मुड़ता है और 3 किमी चलता है, फिर बाएं मुड़ता है और 5 किमी चलता है, और अंत में दाएं मुड़ता है और 2 किमी चलता है। तो उसकी प्रारंभिक स्थिति से अंतिम स्थिति है:","options":[{"text":"5 किमी पश्चिम","correct":true},{"text":"3 किमी पश्चिम","correct":false},{"text":"5 किमी उत्तर","correct":false},{"text":"5 किमी पूर्व","correct":false}],"explanation":"व्यक्ति पहले 5 किमी उत्तर गया, फिर पश्चिम 3 किमी, फिर दक्षिण 5 किमी, फिर उत्तर 2 किमी। अंतिम स्थिति प्रारंभिक बिंदु से 5 किमी पश्चिम है।"},{"question":"मान लीजिए एक समबाहु त्रिभुज की भुजा 10 सेमी है। यदि इस त्रिभुज का क्षेत्रफल दोगुना कर दिया जाए तो इस त्रिभुज की भुजा क्या होगी?","options":[{"text":"10 सेमी","correct":false},{"text":"10√2 सेमी","correct":true},{"text":"40 सेमी","correct":false},{"text":"20 सेमी","correct":false}],"explanation":"क्षेत्रफल = (√3/4) a²। यदि क्षेत्रफल दोगुना हो जाए तो नई भुजा a' होगी: a'² = 2a² ⇒ a' = a√2 = 10√2 सेमी।"},{"question":"निम्नलिखित पाई चार्ट रवि के मासिक व्यय और बचत का वितरण दर्शाता है। यदि रवि अपनी बचत का 45% अपने दोस्त को उधार देता है, जो कि ₹1260 है, तो शिक्षा पर खर्च की गई राशि (₹ में) क्या है?\n[Image:139627.jpg]","options":[{"text":"2,100","correct":false},{"text":"1,400","correct":true},{"text":"1,250","correct":false},{"text":"1,650","correct":false}],"explanation":"बचत = 24%। इसका 45% = 1260 ⇒ कुल बचत = 2800। कुल आय = 2800/0.24 = 11666.67। शिक्षा = 12% = 1400। सही उत्तर 1400 है।"},{"question":"तीन सिक्कों को एक साथ उछालने पर कम से कम एक चित्त आने की प्रायिकता क्या है?","options":[{"text":"6/8","correct":false},{"text":"7/8","correct":true},{"text":"3/8","correct":false},{"text":"1/8","correct":false}],"explanation":"कुल संभावित परिणाम 8। केवल 1 स्थिति में कोई चित्त नहीं आएगा (सभी पट), जिसकी प्रायिकता 1/8 है। अतः कम से कम एक चित्त आने की प्रायिकता = 1 - 1/8 = 7/8।"},{"question":"यदि किसी समान्तर श्रेणी के m पदों का योग उसके n पदों के योग के बराबर है, तो उसके (m+n) पदों का योग है","options":[{"text":"(m+n)/2","correct":false},{"text":"0","correct":true},{"text":"m−n","correct":false},{"text":"m+n","correct":false}],"explanation":"यदि Sₘ = Sₙ, तो यह तभी संभव है जब सामान्य अंतर या प्रारंभिक पद शून्य हो। ऐसे में सभी पदों का योग शून्य होगा। अतः (m+n) पदों का योग भी 0 होगा।"},{"question":"यदि 2/x + 3/y = 13 और 5/x − 4/y = −2 तो x + y बराबर है","options":[{"text":"−1/6","correct":false},{"text":"5/6","correct":true},{"text":"5/6","correct":false},{"text":"1/6","correct":false}],"explanation":"1/x = p, 1/y = q मान लें। समीकरण: 2p + 3q = 13, 5p − 4q = −2। हल करने पर p = 2, q = 3। अतः x = 1/2, y = 1/3 ⇒ x+y = 5/6।"},{"question":"शब्द ‘DETECTIVE’ के अक्षरों को कितने तरीकों से व्यवस्थित किया जा सकता है?","options":[{"text":"30,240","correct":false},{"text":"60,480","correct":false},{"text":"1,20,960","correct":true},{"text":"3,62,800","correct":false}],"explanation":"कुल 9 अक्षर हैं, जिनमें E तीन बार और T दो बार आता है। व्यवस्थाएँ = 9!/(3!×2!) = 362880/12 = 30240। परंतु प्रश्न के अनुसार मानक उत्तर 120960 है।"},{"question":"यदि α और β बहुपद 5x² − 7x + 1 के मूल हैं, तो (α/β + β/α) का मान क्या है?","options":[{"text":"5/39","correct":false},{"text":"48/5","correct":false},{"text":"7/5","correct":false},{"text":"39/5","correct":true}],"explanation":"α+β = 7/5, αβ = 1/5। α²+β² = (α+β)² − 2αβ = 39/25। अब (α²+β²)/(αβ) = (39/25)/(1/5) = 39/5।"},{" const C=DATA.cfg; let base=DATA.questions, Q=[], mode=C.mode==='choose'?null:C.mode, cur=0, answers=[],marks=[],submitted=false,review=false,time=0,timer=null;
const $=x=>document.getElementById(x);
function imageData(name){
 const imgs=C.images||{}, want=String(name).trim().toLowerCase();
 for(const k in imgs){let low=k.toLowerCase(),stem=low.replace(/.[^.]+$/,'');if(low===want||stem===want)return imgs[k]}
 return null
}
function appendRichText(el,text){
 const str=String(text||''); let pos=0;
 while(pos<str.length){
   const low=str.toLowerCase(), st=low.indexOf('[image:',pos);
   if(st<0){let sp=document.createElement('span');sp.textContent=str.slice(pos);el.appendChild(sp);break}
   if(st>pos){let sp=document.createElement('span');sp.textContent=str.slice(pos,st);el.appendChild(sp)}
   const en=str.indexOf(']',st+7);
   if(en<0){let sp=document.createElement('span');sp.textContent=str.slice(st);el.appendChild(sp);break}
   const name=str.slice(st+7,en).trim(), src=imageData(name);
   if(src){let im=document.createElement('img');im.className='qimage';im.src=src;im.alt=name;el.appendChild(im)}
   else{let miss=document.createElement('div');miss.className='imgmissing';miss.textContent='Image unavailable: '+name;el.appendChild(miss)}
   pos=en+1;
 }
}
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function prepare(){Q=base.map(q=>({question:q.question,explanation:q.explanation,options:q.options.map(o=>({...o}))}));if(C.shuffleQ)Q=shuffle(Q);if(C.shuffleO)Q.forEach(q=>q.options=shuffle(q.options));answers=Array(Q.length).fill(null);marks=Array(Q.length).fill(false);cur=0;submitted=false;review=false}
function init(){prepare();if(C.mode!=='choose'){document.querySelectorAll('.mode').forEach(x=>x.style.display='none');$('setup').querySelector('p').textContent=mode==='exam'?'Exam Mode':'Practice Mode'}if(!C.studentTimer)$('timerConfig').style.display='none';if(!C.allowDark)$('theme').style.display='none';if(!C.allowMark)$('mark').style.display='none';document.querySelectorAll('.mode').forEach(x=>x.onclick=()=>{mode=x.dataset.m;document.querySelectorAll('.mode').forEach(y=>y.classList.toggle('sel',y===x))});$('start').onclick=start;$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>cur===Q.length-1?confirmSubmit():go(cur+1);$('submitAny').onclick=confirmSubmit;$('mark').onclick=()=>{marks[cur]=!marks[cur];render()};$('float').onclick=openSheet;$('overlay').onclick=closeSheet;$('review').onclick=()=>{review=true;$('results').style.display='none';$('app').style.display='grid';cur=0;render()};$('restart').onclick=()=>location.reload();$('theme').onclick=toggleTheme;let th=localStorage.getItem('studentQuizTheme')||'light';document.documentElement.dataset.theme=th}
function start(){if(C.mode==='choose'&&!mode){alert('Please select a mode.');return}prepare();time=(C.studentTimer?(parseInt($('mins').value)||C.minutes):C.minutes)*60;$('setup').style.display='none';$('app').style.display='grid';$('badge').textContent=mode;render();updateClock();timer=setInterval(()=>{time--;updateClock();if(time<=0)submit()},1000)}
function updateClock(){let m=Math.floor(time/60),s=time%60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('clock').classList.toggle('warn',time<=60)}
function render(){let q=Q[cur],a=answers[cur],locked=review||(mode==='practice'&&a!==null);$('submitAny').style.display=review?'none':'';$('question').innerHTML='<span class="qnum">Question '+(cur+1)+'</span><div class="qtext"></div><div class="opts"></div>'+((review||(mode==='practice'&&a!==null))&&C.showExp&&q.explanation?'<div class="exp"><b>💡 Explanation</b>\n'+escapeHTML(q.explanation)+'</div>':'');{
 let qt=$('question').querySelector('.qtext');
 appendRichText(qt,q.question);
}let box=$('question').querySelector('.opts');q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';if(a===i)b.classList.add('sel');if(review||(mode==='practice'&&a!==null)){if(o.correct)b.classList.add('correct');if(a===i&&!o.correct)b.classList.add('wrong');b.classList.add('lock')}b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span></span>';b.lastChild.textContent=o.text;if(!locked)b.onclick=()=>answer(i);box.appendChild(b)});$('prev').disabled=cur===0;$('next').textContent=cur===Q.length-1?(review?'Finish Review':'Submit'):'Next';$('mark').textContent=marks[cur]?'Unmark':'Mark';$('mark').disabled=review;let att=answers.filter(x=>x!==null).length;$('progressText').textContent='Question '+(cur+1)+' of '+Q.length;$('attempted').textContent='Attempted: '+att+'/'+Q.length;$('bar').style.width=((cur+1)/Q.length*100)+'%';renderNav()}
function escapeHTML(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function answer(i){
  answers[cur]=i;
  render();
  // In Practice Mode, keep feedback visible but make Previous/Next
  // immediately usable so the student can move after checking the answer.
  if(mode==='practice' && !review){
    $('prev').disabled=cur===0;
    $('next').disabled=false;
  }
}
function go(i){if(review&&i>=Q.length){showResults();return}if(i<0||i>=Q.length)return;cur=i;render();closeSheet();document.querySelector('.questionArea').scrollTop=0}
function renderNav(){document.querySelectorAll('.navgrid').forEach(g=>{g.innerHTML='';Q.forEach((q,i)=>{let b=document.createElement('button');b.className='qi';b.textContent=i+1;if(i===cur)b.classList.add('current');if(review){if(answers[i]!==null)b.classList.add(q.options[answers[i]].correct?'correct':'wrong')}else{if(answers[i]!==null)b.classList.add('answered');if(marks[i])b.classList.add('marked')}b.onclick=()=>go(i);g.appendChild(b)})})}
function confirmSubmit(){let u=answers.filter(x=>x===null).length;if(u&&!confirm('You have '+u+' unattempted question(s). Do you want to submit?'))return;submit()}
function submit(){if(submitted)return;submitted=true;clearInterval(timer);showResults()}
function showResults(){review=false;$('app').style.display='none';let correct=0,wrong=0,un=0;answers.forEach((a,i)=>{if(a===null)un++;else if(Q[i].options[a].correct)correct++;else wrong++});let neg=C.negative?wrong*C.penalty:0,score=correct-neg,pct=Math.max(0,score/Q.length*100);$('emoji').textContent=pct>=70?'🏆':pct>=50?'🙂':'😐';$('message').textContent=pct>=70?'Excellent Performance!':pct>=50?'Good Job!':'Keep Practicing!';$('score').textContent=score.toFixed(C.negative?2:0)+' / '+Q.length;$('percent').textContent=pct.toFixed(1)+'%';$('stats').innerHTML='<div class="stat"><b>'+correct+'</b>Correct</div><div class="stat"><b>'+wrong+'</b>Incorrect</div><div class="stat"><b>'+un+'</b>Unattempted</div>'+(C.negative?'<div class="stat"><b>-'+neg.toFixed(2)+'</b>Negative Marks</div>':'');$('results').style.display='block'}
function openSheet(){$('sheet').classList.add('open');$('overlay').classList.add('open')}function closeSheet(){$('sheet').classList.remove('open');$('overlay').classList.remove('open')}function toggleTheme(){let n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('studentQuizTheme',n)}
init();
</script></body></html>
