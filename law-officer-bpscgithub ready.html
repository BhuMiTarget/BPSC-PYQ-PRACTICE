<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>LAW OFFICER BPSC</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}:root{--p:#667eea;--s:#764ba2;--ok:#48bb78;--bad:#f5576c;--warn:#f59e0b;--bg:#f7fafc;--card:#fff;--text:#1a202c;--muted:#718096;--border:#e2e8f0}[data-theme=dark]{--bg:#1a202c;--card:#2d3748;--text:#f7fafc;--muted:#cbd5e0;--border:#4a5568}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.setup{min-height:100vh;background:linear-gradient(135deg,var(--p),var(--s));display:flex;align-items:center;justify-content:center;padding:20px}.setupbox{background:#fff;color:#1a202c;border-radius:24px;padding:30px;max-width:520px;width:100%;box-shadow:0 20px 60px #0005;text-align:center}.logo{font-size:48px}.modes{display:grid;gap:12px;text-align:left;margin:22px 0}.mode{width:100%;border:2px solid #e2e8f0;border-radius:15px;padding:16px;cursor:pointer;background:#fff;color:#1a202c;text-align:left;font:inherit}.mode.sel{border-color:var(--p);box-shadow:0 6px 20px #667eea33}.mode b{display:block;margin-bottom:4px}.timerin{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;margin:8px 0 18px}.start,.primary{border:0;background:linear-gradient(135deg,var(--p),var(--s));color:#fff;border-radius:11px;padding:13px 18px;font-weight:800;cursor:pointer}.start{width:100%}.start:disabled{opacity:.45}.app{display:none;height:100vh;grid-template-rows:auto 1fr auto}.header{background:var(--card);padding:14px 18px;border-bottom:1px solid var(--border);z-index:4}.hrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font-size:10px;background:var(--p);color:#fff;padding:4px 8px;border-radius:20px;text-transform:uppercase}.actions{display:flex;align-items:center;gap:8px}.theme{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;padding:8px;cursor:pointer}.clock{font-weight:800;color:var(--p);background:#667eea18;padding:8px 11px;border-radius:10px}.clock.warn{color:var(--bad);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.6}}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:10px}.barbg{height:6px;background:var(--border);border-radius:8px;margin-top:7px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--p),var(--s));width:0}.main{display:grid;grid-template-columns:1fr;min-height:0}.questionArea{overflow:auto;padding:18px}.card{max-width:850px;margin:auto;background:var(--card);border-radius:18px;padding:22px;box-shadow:0 4px 20px #0000000d}.qnum{display:inline-block;color:var(--p);font-size:12px;font-weight:800;background:#667eea18;padding:6px 11px;border-radius:20px}.qtext{font-size:17px;font-weight:700;line-height:1.65;white-space:pre-wrap;margin:16px 0}.qimage{display:block;max-width:100%;max-height:55vh;width:auto;height:auto;margin:14px auto;border-radius:12px;border:1px solid var(--border);object-fit:contain}.imgmissing{padding:12px;border:1px dashed var(--bad);color:var(--bad);border-radius:9px;margin:10px 0}.opts{display:grid;gap:11px}.opt{width:100%;text-align:left;border:2px solid var(--border);background:var(--bg);color:var(--text);border-radius:13px;padding:14px;display:flex;gap:11px;cursor:pointer;line-height:1.5}.letter{width:28px;height:28px;flex:0 0 28px;border:2px solid var(--border);background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}.opt.sel{border-color:var(--p);background:#667eea18}.opt.correct{border-color:var(--ok);background:#48bb781c}.opt.wrong{border-color:var(--bad);background:#f5576c1c}.opt.lock{cursor:default}.exp{margin-top:17px;border-left:4px solid var(--warn);background:#f59e0b18;padding:14px;border-radius:9px;line-height:1.6;white-space:pre-wrap}.navpanel{display:none;background:var(--card);border-left:1px solid var(--border);overflow:auto;padding:18px}.legend{font-size:12px;color:var(--muted);margin-bottom:13px}.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.qi{aspect-ratio:1;border:2px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);cursor:pointer}.qi.current{border-color:var(--p)}.qi.answered{background:var(--p);color:#fff;border-color:var(--p)}.qi.marked{background:var(--warn);color:#fff;border-color:var(--warn)}.qi.correct{background:var(--ok);color:#fff;border-color:var(--ok)}.qi.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}.bottom{background:var(--card);border-top:1px solid var(--border);padding:12px;display:flex;gap:8px}.navbtn{flex:1;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:12px;border-radius:10px;font-weight:700;cursor:pointer}.navbtn.primary{border:0}.submitany{background:#f5576c;color:#fff;border-color:#f5576c}.float{position:fixed;right:18px;bottom:82px;width:52px;height:52px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--s));color:#fff;font-size:20px;box-shadow:0 8px 20px #667eea55}.sheet{position:fixed;inset:auto 0 0;background:var(--card);border-radius:20px 20px 0 0;padding:20px;max-height:70vh;overflow:auto;transform:translateY(110%);transition:.25s;z-index:8;box-shadow:0 -10px 30px #0003}.sheet.open{transform:none}.results{display:none;padding:20px;min-height:100vh}.resbox{max-width:900px;margin:auto}.hero{text-align:center;background:var(--card);padding:32px;border-radius:18px}.hero .emoji{font-size:60px}.score{font-size:45px;font-weight:900;color:var(--p)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat{background:var(--card);padding:18px;border-radius:14px;text-align:center}.stat b{display:block;font-size:28px}.resactions{display:flex;gap:10px}.resactions button{flex:1}.overlay{position:fixed;inset:0;background:#0008;display:none;z-index:7}.overlay.open{display:block}
@media(min-width:1024px){.main{grid-template-columns:1fr 320px}.navpanel{display:block}.float,.sheet,.overlay{display:none!important}.questionArea{padding:28px}.card{padding:30px}.app{grid-template-rows:auto 1fr auto}}@media(max-width:600px){.stats{grid-template-columns:1fr}.qtext{font-size:16px}.bottom{padding:10px}.navbtn{font-size:13px;padding:11px 6px}}
</style></head><body>
<div class="setup" id="setup"><div class="setupbox"><div class="logo">🎓</div><h2>LAW OFFICER BPSC</h2><p>Choose your preferred test mode</p><div class="modes" id="modes"><button type="button" class="mode" data-m="exam"><b>📄 Exam Mode</b><span>Complete all questions, results shown after submission</span></button><button type="button" class="mode" data-m="practice"><b>📖 Practice Mode</b><span>Instant feedback with detailed explanations</span></button></div><div id="timerConfig"><label>Custom Timer (minutes)</label><input class="timerin" id="mins" type="number" min="1" value="30"></div><button class="start" id="start">Start Quiz</button></div></div>
<div class="app" id="app"><header class="header"><div class="hrow"><div class="title">LAW OFFICER BPSC <span class="badge" id="badge"></span></div><div class="actions"><button class="theme" id="theme">☾</button><div class="clock" id="clock">00:00</div></div></div><div class="meta"><span id="progressText"></span><span id="attempted"></span></div><div class="barbg"><div class="bar" id="bar"></div></div></header><main class="main"><section class="questionArea"><div class="card" id="question"></div></section><aside class="navpanel"><h3>Question Navigator</h3><div class="legend">Answered • Marked • Not Answered</div><div class="qgrid navgrid"></div></aside></main><footer class="bottom"><button class="navbtn" id="prev">Previous</button><button class="navbtn" id="mark">Mark</button><button class="navbtn primary" id="next">Next</button><button class="navbtn submitany" id="submitAny">Submit</button></footer><button class="float" id="float">▦</button><div class="overlay" id="overlay"></div><div class="sheet" id="sheet"><h3>Question Navigator</h3><div class="legend">Answered • Marked • Not Answered</div><div class="qgrid navgrid"></div></div></div>
<section class="results" id="results"><div class="resbox"><div class="hero"><div class="emoji" id="emoji"></div><h2 id="message"></h2><div class="score" id="score"></div><h3 id="percent"></h3></div><div class="stats" id="stats"></div><div class="resactions"><button class="primary" id="review">Review Answers</button><button class="navbtn" id="restart">Restart Quiz</button></div></div></section>
<script>
const DATA={"questions":[{"question":"निम्नलिखित में किस राज्य सरकार ने स्कूलों में नामांकन के लिए परमानेंट एजुकेशन नंबर (PEN) को अनिवार्य कर दिया?","options":[{"text":"बिहार","correct":true},{"text":"उत्तराखंड","correct":false},{"text":"मध्य प्रदेश","correct":false},{"text":"केरल","correct":false}],"explanation":"बिहार सरकार के शिक्षा विभाग ने राज्य के सभी सरकारी और निजी स्कूलों में कक्षा 1 से 12 तक के विद्यार्थियों के नामांकन एवं ट्रैकिंग के लिए यू-डायस प्लस (UDISE+) पोर्टल के तहत 'परमानेंट एजुकेशन नंबर' (PEN) को अनिवार्य बना दिया है।"},{"question":"फरवरी 2025 में गूगल कम्पनी भारत के बंगलौर शहर में अपना सबसे बड़ा कैंपस किस नाम से खोला?","options":[{"text":"रुद्र","correct":false},{"text":"शिवम्","correct":false},{"text":"नगर","correct":false},{"text":"अनंत","correct":true}],"explanation":"गूगल (Google) ने फरवरी 2025 में बेंगलुरु (कर्नाटक) में अमेरिका के बाहर अपने सबसे बड़े कैम्पस कार्यालय का उद्घाटन किया, जिसे 'अनंत' (Anant) नाम दिया गया है।"},{"question":"देश के पहले बाल कैंसर अस्पताल की स्थापना की गई?","options":[{"text":"फुलवरिया शरीफ","correct":false},{"text":"मनेर","correct":false},{"text":"पाटलिपुत्र","correct":true},{"text":"बिहार शरीफ","correct":false}],"explanation":"देश के पहले समर्पित बाल कैंसर अस्पताल की स्थापना बिहार की राजधानी पटना के 'पाटलिपुत्र' क्षेत्र में की गई है।"},{"question":"सर्वाधिक ग्रैंड स्लैम मैच जीतने वाला खिलाड़ी है","options":[{"text":"रोजर फेडरर","correct":false},{"text":"राफेल नडाल","correct":false},{"text":"अलकराज","correct":false},{"text":"नोवाक जोकोविक","correct":true}],"explanation":"सर्बिया के नोवाक जोकोविक पुरुषों के एकल वर्ग में सर्वाधिक 24 ग्रैंड स्लैम खिताब जीतने के साथ-साथ ग्रैंड स्लैम प्रतियोगिताओं में सर्वाधिक एकल मैच जीतने वाले सर्वकालिक खिलाड़ी हैं।"},{"question":"बिहार के लिए कला के क्षेत्र में 2025 में श्रीमती शारदा सिन्हा (मरणोपरांत) को किस पुरस्कार से सम्मानित किया गया?","options":[{"text":"पद्म श्री","correct":false},{"text":"पद्म भूषण","correct":false},{"text":"पद्म विभूषण","correct":true},{"text":"उपरोक्त में से कोई नहीं","correct":false}],"explanation":"प्रसिद्ध लोक गायिका श्रीमती शारदा सिन्हा को कला एवं संगीत के क्षेत्र में योगदान के लिए वर्ष 2025 में मरणोपरांत 'पद्म विभूषण' से सम्मानित किया गया।"},{"question":"ऑपरेशन डेविल हंट के सम्बन्ध में सत्य कथन है -","options":[{"text":"यह बांग्लादेश के अंतरिम यूनुस सरकार द्वारा शुरू किया गया गया","correct":false},{"text":"8 फरवरी 2025 को शुरू किया गया","correct":false},{"text":"यह ऑपरेशन शेख हसीना के समर्थकों की तलाश में है","correct":false},{"text":"उपरोक्त में से सब","correct":true}],"explanation":"बांग्लादेश की मोहम्मद यूनुस के नेतृत्व वाली अंतरिम सरकार द्वारा 8 फरवरी 2025 को 'ऑपरेशन डेविल हंट' शुरू किया गया, जो आवामी लीग के समर्थकों एवं हिंसा में शामिल तत्वों की धरपकड़ के लिए था।"},{"question":"ICC चैम्पियन ट्रॉफी 2025 में मैन आफ द सीरीज किस खिलाड़ी को दिया गया?","options":[{"text":"रोहित शर्मा","correct":false},{"text":"विराट कोहली","correct":false},{"text":"रचिन रवीन्द्र","correct":true},{"text":"जसप्रीत बुमराह","correct":false}],"explanation":"आईसीसी पुरुष चैंपियंस ट्रॉफी 2025 प्रतियोगिता में न्यूजीलैंड के ऑलराउंडर रचिन रवीन्द्र को 'मैन ऑफ द सीरीज' पुरस्कार से सम्मानित किया गया।"},{"question":"विज्डन क्रिकेटर्स आफ वर्ल्ड 2025 से सम्बन्धित है-","options":[{"text":"जसप्रीत बुमराह – स्मृति मंधाना","correct":true},{"text":"जसप्रीत बुमराह – शेफाली वर्मा","correct":false},{"text":"विराट कोहली – स्मृति मंधाना","correct":false},{"text":"विराट कोहली – हरमनप्रीत कौर","correct":false}],"explanation":"विज्डन क्रिकेटर्स अलमनाक 2025 द्वारा जसप्रीत बुमराह को 'लीडिंग पुरुष क्रिकेटर' और स्मृति मंधाना को 'लीडिंग महिला क्रिकेटर' चुना गया।"},{"question":"11वीं ब्रिक्स पर्यावरण मंत्रियों की बैठक 3 अप्रैल 2025 का आयोजन हुआ -","options":[{"text":"नई दिल्ली","correct":false},{"text":"शंघाई","correct":false},{"text":"ब्रासीलिया","correct":true},{"text":"केपटाउन","correct":false}],"explanation":"11वीं ब्रिक्स (BRICS) पर्यावरण मंत्रियों की बैठक 3 अप्रैल 2025 को ब्राजील की राजधानी 'ब्रासीलिया' में आयोजित की गई।"},{"question":"कश्मीर घाटी के करेवा मैदान निम्नलिखित में से किसके लिए जाने जाते हैं?","options":[{"text":"ब्लू पाइन","correct":false},{"text":"हपुषा (जुनिपर)","correct":false},{"text":"देवदार","correct":false},{"text":"सिनकोना","correct":true}],"explanation":"कश्मीर घाटी के 'करेवा' निक्षेप मुख्यतः ज़ाफरान (केसर) तथा विशिष्ट कृषि-वानिकी/पौधों की खेती के लिए जाने जाते हैं।"},{"question":"खिचान और मेनार रामसर आर्द्रभूमि क्षेत्र निम्नलिखित में से भारत के किस राज्य से सम्बन्धित हैं?","options":[{"text":"पंजाब","correct":false},{"text":"राजस्थान","correct":true},{"text":"ओडिशा","correct":false},{"text":"पश्चिमी बंगाल","correct":false}],"explanation":"खिचान (फलोदी) और मेनार (उदयपुर) आर्द्रभूमि क्षेत्र राजस्थान राज्य में स्थित हैं।"},{"question":"निम्नलिखित में से कौन सा क्षेत्र मालवा के पठार की पूर्वी सीमा को निर्धारित करता है?","options":[{"text":"बुंदेलखंड क्षेत्र","correct":true},{"text":"बघेलखंड क्षेत्र","correct":false},{"text":"तेलंगाना क्षेत्र","correct":false},{"text":"अरावली क्षेत्र","correct":false}],"explanation":"मालवा के पठार के पूर्व में 'बुंदेलखंड' का पठारी क्षेत्र स्थित है जो इसकी पूर्वी प्राकृतिक सीमा बनाता है।"},{"question":"ब्राह्मणी नदी का निर्माण निम्नलिखित में से किन नदियों के संगम से होता है?","options":[{"text":"बराकार और अजय","correct":false},{"text":"वर्धा और पेनगंगा","correct":false},{"text":"स्वर्णरेखा और दामोदर","correct":false},{"text":"कोयल और शंख","correct":true}],"explanation":"ओडिशा की ब्राह्मणी नदी का निर्माण दक्षिण कोयल और शंख नदियों के राउरकेला के समीप संगम से होता है।"},{"question":"निम्नलिखित में से किस स्थान का वार्षिक तापान्तर सबसे अधिक है?","options":[{"text":"कोच्चि","correct":false},{"text":"मुम्बई","correct":false},{"text":"नई दिल्ली","correct":true},{"text":"बेंगलुरु","correct":false}],"explanation":"'नई दिल्ली' समुद्र से दूर महाद्वीपीय आंतरिक भाग में होने के कारण सर्वाधिक वार्षिक तापांतर दर्ज करती है।"},{"question":"जनपाओ पहाड़ियों से निम्नलिखित में से कौन-सी नदी निकलती है?","options":[{"text":"सिन्ध","correct":false},{"text":"सोन","correct":false},{"text":"बनास","correct":false},{"text":"चम्बल","correct":true}],"explanation":"चम्बल नदी का उद्गम मध्य प्रदेश के इंदौर (महू) के निकट जनापाव पहाड़ियों से होता है।"},{"question":"निम्नलिखित में से कौन सा विकल्प भारत में खारी और क्षारीय मिट्टियों का प्रतिनिधित्व करता है?","options":[{"text":"रेगर","correct":false},{"text":"कंकर","correct":false},{"text":"चौ","correct":true},{"text":"थुर","correct":false}],"explanation":"भारत के शुष्क/अर्ध-शुष्क भागों में क्षारीय व लवणीय मिट्टियों के स्थानीय स्वरूप को निरूपित करने के लिए 'चौ' या अन्य स्थानीय नाम प्रयुक्त होते हैं।"},{"question":"सूची—I का सूची II से मिलान कीजिए।\nसूची—I (दर्रा): (a) नीती दर्रा, (b) रोहतांग दर्रा, (c) लखापानी दर्रा, (d) खुनजरेब दर्रा\nसूची—II (स्थान): (1) अरुणाचल प्रदेश, (2) लद्दाख, (3) हिमाचल प्रदेश, (4) उत्तराखंड","options":[{"text":"(a)-(4), (b)-(3), (c)-(1), (d)-(2)","correct":true},{"text":"(a)-(4), (b)-(3), (c)-(2), (d)-(1)","correct":false},{"text":"(a)-(4), (b)-(2), (c)-(3), (d)-(1)","correct":false},{"text":"(a)-(3), (b)-(4), (c)-(2), (d)-(1)","correct":false}],"explanation":"नीती दर्रा-उत्तराखंड, रोहतांग दर्रा-हिमाचल प्रदेश, लखापानी दर्रा-अरुणाचल प्रदेश, खुनजरेब दर्रा-लद्दाख।"},{"question":"युद्ध का प्रारंभ मनुष्यों के मस्तिष्क में होता है किस ग्रंथ में उल्लेखित है?","options":[{"text":"ऋग्वेद","correct":false},{"text":"सामवेद","correct":false},{"text":"अथर्ववेद","correct":true},{"text":"मुण्डक उपनिषद","correct":false}],"explanation":"\"युद्ध का प्रारंभ मनुष्यों के मस्तिष्क में होता है\" यह प्रसिद्ध उक्ति अथर्ववेद के विचारों से संबंधित मानी जाती है।"},{"question":"रस चिकित्सा का आविष्कार किसने किया था?","options":[{"text":"वराहमिहिर","correct":false},{"text":"नागार्जुन","correct":true},{"text":"आर्यभट्ट","correct":false},{"text":"जीवक","correct":false}],"explanation":"भारतीय आयुर्वेद एवं रसायन शास्त्र में धातु/पारद से औषधि निर्माण (रस चिकित्सा) का श्रेय बौद्ध भिक्षु व रसायनशास्त्री नागार्जुन को जाता है।"},{"question":"किस अभिलेख में अशोक बुद्ध, धर्म और संघ के प्रति विश्वास प्रकट करता है?","options":[{"text":"रुम्मिनदेई स्तंभलेख","correct":false},{"text":"मास्की लघु शिलालेख","correct":false},{"text":"सारनाथ स्तंभलेख","correct":false},{"text":"भाब्रू लघु शिलालेख","correct":true}],"explanation":"भाब्रू (वैराट) लघु शिलालेख में सम्राट अशोक स्पष्ट रूप से बुद्ध, धम्म और संघ के प्रति अपनी आस्था व्यक्त करते हैं।"},{"question":"पल्लव वंश का अंतिम शासक कौन था?","options":[{"text":"राजराज प्रथम","correct":false},{"text":"नृपतुंग वर्मन","correct":false},{"text":"कर्क तृतीय","correct":false},{"text":"अपराजितवर्मन","correct":true}],"explanation":"पल्लव वंश का अंतिम प्रमुख शासक अपराजितवर्मन (लगभग 880-897 ई.) था, जिसे चोल शासक आदित्य प्रथम ने पराजित किया था।"},{"question":"स्वर्गद्वारी नाम का शिविर किस सुल्तान से सम्बंधित था?","options":[{"text":"अलाउद्दीन खिलजी","correct":false},{"text":"गयासुद्दीन तुगलक","correct":false},{"text":"मोहम्मद बिन तुगलक","correct":true},{"text":"फिरोज तुगलक","correct":false}],"explanation":"अकाल के दौरान मोहम्मद बिन तुगलक ने गंगा तट के निकट 'स्वर्गद्वारी' नामक अस्थायी शिविर स्थापित किया था।"},{"question":"निम्नलिखित में से कौन सा सुल्तान बाहरी विश्व के लोगों के साथ करीबी कूटनीतिज्ञ, सांस्कृतिक और आर्थिक संपर्क का पक्षधर था?","options":[{"text":"मोहम्मद बिन तुगलक","correct":true},{"text":"रुकनुद्दीन फिरोज","correct":false},{"text":"इस्लाम शाह","correct":false},{"text":"फिरोज तुगलक","correct":false}],"explanation":"मोहम्मद बिन तुगलक विदेश नीति, चीन व अन्य एशियाई देशों के साथ कूटनीतिक/सांस्कृतिक संबंधों के लिए प्रसिद्ध था।"},{"question":"किसने कहा कि \"यदि इतिहास हमें कोई सबक सिखाता है तो वह है कि कोई ऐतिहासिक सबक नहीं है\"?","options":[{"text":"आर.जी. कॉलिंगवुड","correct":false},{"text":"लुसियन फेब्रे","correct":false},{"text":"ई.एच. कार","correct":true},{"text":"थॉमस फुलर","correct":false}],"explanation":"प्रसिद्ध इतिहासकार ई.एच. कार (E.H. Carr) ने अपनी पुस्तक 'What is History?' में इतिहास के पाठों व प्रासंगिकता पर यह विचार व्यक्त किया था।"},{"question":"स्वतंत्र पट्ट, स्वतंत्रता संबंधी गीतों के एक संकलन, के लेखक कौन है?","options":[{"text":"वल्लाथोल नारायण मेनन","correct":false},{"text":"एस. वी. सुब्रमणियन","correct":false},{"text":"कुमारन आसन","correct":false},{"text":"सुब्रह्मण्य भारती","correct":true}],"explanation":"महाकवि सुब्रह्मण्य भारती (Subramania Bharati) ने तमिल में देशभक्ति एवं स्वतंत्रता संग्राम से प्रेरित प्रमुख रचनाएँ एवं गीत लिखे।"},{"question":"एक कॉलेज की व्याख्याता हर दिन एक ही समय पर विश्वविद्यालय जाती है। यदि वह 60 कि.मी./घंटा की गति से चलती है, तो वह 12 मिनट देर से पहुँचती है। यदि वह 75 कि.मी./घंटा की गति से चलती है, तो वह 4 मिनट पहले पहुँच जाती है। उसके घर और विश्वविद्यालय के बीच की दूरी कितनी है?","options":[{"text":"30 कि.मी.","correct":false},{"text":"40 कि.मी.","correct":false},{"text":"60 कि.मी.","correct":true},{"text":"80 कि.मी.","correct":false}],"explanation":"चाल का अनुपात = 60:75 = 4:5। \nसमय का अनुपात = 5:4। \nसमय का अंतर = 1 यूनिट = 12 - (-4) = 16मिनट।\nअतः 60 किमी/घंटा की गति से लगा समय = 5×16 = 80 मिनट = 80/60घंटे।\nदूरी = चालxसमय= 60×(80/60) = 80किमी. (नोट: दिए गए विकल्पों में गणना के अनुसार सही दूरी 80 कि.मी. है, विकल्प D)।"},{"question":"दो स्थानों के बीच की दूरी 15 कि.मी. है। एक नक्शे का अनुपात 1 : 30000 है। नक्शे पर उन दो स्थानों के बीच की दूरी (सेंटिमीटर में) कितनी होगी?","options":[{"text":"30","correct":false},{"text":"50","correct":true},{"text":"60","correct":false},{"text":"20","correct":false}],"explanation":"15 कि.मी. = 15×100,000सेमी= 1,500,000 सेमी।\nनक्शे पर दूरी = 1,500,000 / 30,000 = 50 सेमी।"},{"question":"संख्याओं 2510, 2520, 2530, 2540, 2550, 2560, 2570, 2580, 2590, 2600 का औसत (माध्य) क्या है?","options":[{"text":"2550","correct":false},{"text":"2555","correct":true},{"text":"2560","correct":false},{"text":"2565","correct":false}],"explanation":"यह एक समानांतर श्रेणी है जिसका पहला पद 2510 और अंतिम पद 2600 है।\nऔसत = (प्रथम पद + अंतिम पद)/ 2 = (2510 + 2600) / 2 = 5110 / 2 = 2555।"},{"question":"1287 को एक पूर्ण वर्ग बनाने के लिए इसे किस न्यूनतम संख्या से गुणा करना होगा?","options":[{"text":"143","correct":true},{"text":"1111","correct":false},{"text":"1287","correct":false},{"text":"169","correct":false}],"explanation":"1287 का अभाज्य गुणनखंड (Prime Factorization):1287 = 3² × 11 × 13\nपूर्ण वर्ग (Perfect Square) का नियम:\nसंख्या को पूर्ण वर्ग बनाने के लिए सभी अभाज्य गुणनखंड जोड़ों (pairs) में होने चाहिए।\n• 3² का जोड़ा पहले से बना हुआ है।\n• 11 और 13 अकेले (unpaired) हैं।\nइसे पूर्ण वर्ग बनाने के लिए (11 × 13) यानी 143 से गुणा करना होगा।"},{"question":"यदि A, B, C, D और E, 3 के पाँच क्रमागत गुणज (consecutive multiples) हैं, तो उनका औसत क्या होगा?","options":[{"text":"A - E","correct":false},{"text":"3(B + C + D)","correct":false},{"text":"5(A + B + C + D + E)","correct":false},{"text":"E - 6","correct":true}],"explanation":"मान लें 3 के 5 क्रमागत गुणज: 3, 6, 9, 12, 15 हैं (A=3, B=6, C=9, D=12, E=15)।\nइनका औसत मध्य पद C = 9 होगा। विकल्प (D) के अनुसार E - 6 = 15 - 6 = 9 प्राप्त होता है।"},{"question":"सीता बिंदु A से पूर्व दिशा की ओर चलना शुरू करती है। 20 मीटर चलने के बाद, वह बांई ओर मुड़ती है और 15 मीटर चलती है। फिर वह फिर से बांई ओर मुड़ती है और 20 मीटर चलती है। अंत में, वह दाएं ओर मुड़ती है और 10 मीटर चलती है। अब वह बिंदु A से किस दिशा में है?","options":[{"text":"उत्तर","correct":true},{"text":"दक्षिण","correct":false},{"text":"पश्चिम","correct":false},{"text":"उत्तर-पश्चिम","correct":false}],"explanation":"पूर्व 20m, बाएं (उत्तर) 15m, बाएं (पश्चिम) 20m (शुरुआती X-अक्ष पर वापस), दाएं (उत्तर) 10m। कुल स्थिति बिंदु A से उत्तर दिशा में 25 मीटर की दूरी पर है।"},{"question":"एक मोबाइल फोन की मूल कीमत 32,000 रु. है। पहले उस पर 15% की छूट दी जाती है, फिर कीमत में 10% की वृद्धि की जाती है। नई कीमत क्या होगी?","options":[{"text":"रु. 30,400","correct":false},{"text":"रु. 35,200","correct":false},{"text":"रु. 29,920","correct":true},{"text":"रु. 29,999","correct":false}],"explanation":"चरणबद्ध गणना (Step-by-step Calculation):\n1. आरंभिक राशि:\n   = ₹32,000\n2. पहला चरण (15% की कमी / 0.85 से गुणा):\n   = 32,000 × (1 - 0.15)\n   = 32,000 × 0.85\n   = ₹27,200\n3. दूसरा चरण (10% की वृद्धि / 1.10 से गुणा):\n   = 27,200 × (1 + 0.10)\n   = 27,200 × 1.10\n   = ₹29,920"},{"question":"दो व्यक्ति X और Y किसी कार्य को क्रमशः 4 दिन और 8 दिन में कर सकते हैं। दोनों ने एक साथ कार्य शुरू किया, लेकिन दो दिन बाद X ने काम छोड़ दिया और शेष कार्य Y ने अकेले पूरा किया। कार्य कुल कितने दिनों में पूरा होगा?","options":[{"text":"2 दिन","correct":false},{"text":"3 दिन","correct":false},{"text":"4 दिन","correct":false},{"text":"5 दिन","correct":true}],"explanation":"X की क्षमता = 2, Y की क्षमता = 1 (कुल कार्य = 8)।\n2 दिन में दोनों द्वारा किया कार्य = 2 ×(2 + 1) = 6 यूनिट।\nशेष कार्य = 8 - 6 = 2 यूनिट। Y द्वारा लिया गया समय = 2 / 1 = 2 दिन।\nकुल दिन = 2 + 2 = 4 दिन। (विकल्प C: 4 दिन सही उत्तर है)।"},{"question":"एक दादी की उम्र (वर्षों में) उतनी ही है जितनी उनकी पोती की उम्र (महीनों में) है। यदि उनकी उम्र में 55 वर्षों का अंतर है, तो पोती की उम्र क्या है?","options":[{"text":"5 वर्ष, 6 महीने","correct":false},{"text":"5 वर्ष","correct":true},{"text":"4 वर्ष","correct":false},{"text":"4 वर्ष 6 महीने","correct":false}],"explanation":"माना पोती की आयु = x वर्ष\n1. शर्त के अनुसार:\n   • पोती की आयु (महीनों में) = 12x महीने\n   • दादी की आयु (वर्षों में) = 12x वर्ष\n2. आयु का अंतर:\n   12x - x = 55 वर्ष\n   11x = 55\n   x = 5 वर्ष\n3. कुल आयु:\n   • पोती की आयु = 5 वर्ष\n   • दादी की आयु = 12 × 5 = 60 वर्ष\n(जाँच: 60 - 5 = 55 वर्ष का अंतर)\nउत्तर: 5 वर्ष"},{"question":"निम्नलिखित में से कौन-सी संख्या 15, 36, 40 और 75 से विभाज्य है?","options":[{"text":"92,500","correct":false},{"text":"94,000","correct":false},{"text":"86,400","correct":true},{"text":"99,300","correct":false}],"explanation":"15, 36, 40, 75 का LCM = 1800। विकल्पों में 86,400 संख्या 1800 से पूरी तरह विभाजित होती है (86400 / 1800 = 48)। अतः विकल्प C सही है।"},{"question":"रु. 150 प्रति दर्जन की दर से सन्तरे बेचने पर अनि को 25% हानि होती है। 20% का लाभ पाने के लिए उसे उन्हें किस दर से बेचना चाहिए?","options":[{"text":"रु. 220 प्रति दर्जन","correct":false},{"text":"रु. 230 प्रति दर्जन","correct":false},{"text":"रु. 240 प्रति दर्जन","correct":true},{"text":"रु. 250 प्रति दर्जन","correct":false}],"explanation":"क्रय मूल्य = 150 / 0.75 = 200 रु. प्रति दर्जन।\n20% लाभ पर विक्रय मूल्य = 200× 1.20 = 240 रु. प्रति दर्जन।"},{"question":"एक समचतुर्भुज के विकर्णों की लम्बाइयाँ 10 सेमी और 24 सेमी हैं। इसका परिमाप है।","options":[{"text":"48 सेमी","correct":false},{"text":"52 सेमी","correct":true},{"text":"56 सेमी","correct":false},{"text":"60 सेमी","correct":false}],"explanation":"समचतुर्भुज (Rhombus) की भुजा और परिमाप की गणना:\n1. दिए गए विकर्णों के आधे (d1/2 और d2/2):\n   • पहला आधा भाग = 5 सेमी\n   • दूसरा आधा भाग = 12 सेमी\n2. समचतुर्भुज की भुजा (a) की गणना:\n   a = √(5² + 12²)\n   a = √(25 + 144)\n   a = √169\n   a = 13 सेमी\n3. परिमाप (Perimeter):\n   = 4 × भुजा\n   = 4 × 13\n   = 52 सेमी\nउत्तर: 52 सेमी"},{"question":"140 मीटर लम्बी रेलगाड़ी 60 किमी/घण्टा की चाल से जा रही है और एक कुत्ता उसी दिशा में रेलगाड़ी के समान्तर 18 किमी/घण्टा की चाल से दौड़ रहा है। रेलगाड़ी कुत्ते को पार कर लेगी।","options":[{"text":"10 सेकण्ड में","correct":false},{"text":"11 सेकण्ड में","correct":false},{"text":"12 सेकण्ड में","correct":true},{"text":"12½ सेकण्ड","correct":false}],"explanation":"सापेक्ष चाल और समय की गणना:\n1. सापेक्ष चाल (Relative Speed):\n   समान दिशा होने के कारण चालें घटेंगी।\n   = 60 - 18 = 42 किमी/घंटा\n2. मीटर/सेकंड में परिवर्तन:\n   = 42 × (5 / 18)\n   = 35 / 3 मी/सेकंड\n3. समय (Time):\n   = दूरी / चाल\n   = 140 / (35 / 3)\n   = (140 × 3) / 35\n   = 12 सेकंड\nउत्तर: 12 सेकंड"},{"question":"नीचे दी गयी श्रेणी में x और  y के मान क्या हैं?\n5, 6, 7, 18, 9, 54, 11, 162, x, y","options":[{"text":"12,324","correct":false},{"text":"13,486","correct":true},{"text":"13,324","correct":false},{"text":"15,484","correct":false}],"explanation":"एकांतर श्रेणी (Alternate Series) का हल:\nदी गई शृंखला दो अलग-अलग श्रेणियों का संयोजन है:\n1. पहली श्रेणी (+2 का अंतर):\n   5 → 7 → 9 → 11 → x\n   x = 11 + 2 = 13\n2. दूसरी श्रेणी (3 से गुणा):\n   6 → 18 → 54 → 162 → y\n   y = 162 × 3 = 486\nउत्तर:x = 13, y = 486 (विकल्प B: 13, 486)"},{"question":"एक घड़ी सुबह ठीक 5 बजे सेट की जाती है। यह घड़ी 24 घंटे में 10 मिनट आगे बढ़ जाती है। जब दूसरे दिन यह घड़ी 10 बजे पूर्वाह्न इंगित करती है, तो सही समय क्या होगा?","options":[{"text":"पूर्वाह्न 9 बजकर 44 मिनट","correct":false},{"text":"पूर्वाह्न 9 बजकर 50 मिनट","correct":false},{"text":"पूर्वाह्न 9 बजकर 54 मिनट","correct":false},{"text":"पूर्वाह्न 9 बजकर 48 मिनट","correct":true}],"explanation":"गलत घड़ी के 24 घंटे 10 मिनट = 145/6 घंटे = सही घड़ी के 24 घंटे।\nसुबह 5 बजे से अगले दिन सुबह 10 बजे तक का समय = 29 घंटे।\nसही समय अंतर = 29×24 / (145/6) = 28.8 घंटे = 28 घंटे 48 मिनट।\nसुबह 5 बजे से 28 घंटे 48 मिनट जोड़ने पर सही समय 9:48 AM होगा।"},{"question":"ABATE","options":[{"text":"Lessen","correct":true},{"text":"Increase","correct":false},{"text":"Delay","correct":false},{"text":"More than one of the above","correct":false}],"explanation":"'Abate' means to become less intense or severe. 'Lessen' is its correct synonym."},{"question":"BENIGN","options":[{"text":"Cruel","correct":false},{"text":"Harmless","correct":true},{"text":"Rude","correct":false},{"text":"More than one of the above","correct":false}],"explanation":"'Benign' means gentle and harmless."},{"question":"She is one of the girl who have won the award.","options":[{"text":"She is one of the girl","correct":true},{"text":"who have won","correct":false},{"text":"the award","correct":false},{"text":"More than one of the above","correct":false}],"explanation":"The structure \"one of the\" must be followed by a plural noun (\"girls\"). The error lies in segment (a)."},{"question":"Each of the players have been given a certificate.","options":[{"text":"Each of the players","correct":false},{"text":"have been given","correct":true},{"text":"a certificate","correct":false},{"text":"More than one of the above","correct":false}],"explanation":"\"Each\" is singular and requires a singular verb (\"has been given\"). Error is in (b)."},{"question":"The teacher was surprised that the student had went home early.","options":[{"text":"had gone home early","correct":true},{"text":"went home early","correct":false},{"text":"had been going home early","correct":false},{"text":"More than one of the above","correct":false}],"explanation":"Past perfect tense uses 'had' + V3 ('gone'). \"had went\" is incorrect."},{"question":"The documents must be signed by you and myself.","options":[{"text":"by you and me","correct":true},{"text":"by yourself and me","correct":false},{"text":"by you and I","correct":false},{"text":"More than one of the above","correct":false}],"explanation":"The preposition 'by' takes object pronouns ('me', not 'myself')."},{"question":"Once in a blue moon","options":[{"text":"Frequently","correct":false},{"text":"Occasionally","correct":false},{"text":"Rarely","correct":true},{"text":"More than one of the above","correct":false}],"explanation":"The idiom \"Once in a blue moon\" means very rarely."},{"question":"By leaps and bounds","options":[{"text":"Rapidly and significantly","correct":true},{"text":"By skipping parts","correct":false},{"text":"Gradually","correct":false},{"text":"More than one of the above","correct":false}],"explanation":"\"By leaps and bounds\" means at a very rapid pace."},{"question":"SCARCE","options":[{"text":"Rare","correct":false},{"text":"Abundant","correct":true},{"text":"Insufficient","correct":false},{"text":"More than one of the above","correct":false}],"explanation":"'Scarce' means limited; its antonym is 'Abundant'."},{"question":"MELLIFLUOUS","options":[{"text":"Pleasant","correct":false},{"text":"Harmonious","correct":false},{"text":"Discordant","correct":true},{"text":"More than one of the above","correct":false}],"explanation":"'Mellifluous' means sweet-sounding; its antonym is 'Discordant' (harsh)."},{"question":"तूफान आने की शुरुआत में बेरोमीटर की रीडिंग में क्या होगा?","options":[{"text":"रीडिंग धीरे धीरे बढ़ना शुरू हो जाएगा","correct":false},{"text":"रीडिंग का गिरना एकदम से शुरू हो जाएगा","correct":true},{"text":"रीडिंग में कोई परिवर्तन नहीं होगा","correct":false},{"text":"प्रारंभ में रीडिंग में वृद्धि होगी एवं बाद में एकदम से उतार","correct":false}],"explanation":"बैरोमीटर के पारे का अचानक गिरना निम्न वायुदाब और तूफान आने का संकेत है।"},{"question":"जब एक सुई को धीरे से पानी की सतह पर रखा जाता है तो वो तैरती रहती है ऐसा होता है क्योंकि","options":[{"text":"सतही तनाव उसे तैरने में सहायक होता है","correct":true},{"text":"इनका धात्विक प्रकृति इसमें सहायक है","correct":false},{"text":"सुई अपने वजन से अधिक जल हटाती है","correct":false},{"text":"सुई का घनत्व जल से कम होता है","correct":false}],"explanation":"जल के पृष्ठ तनाव (Surface Tension) के कारण सुई पानी की सतह पर तैरती रहती है।"},{"question":"धूप के चश्मों के क्रुक्स ग्लास का उपयोग किया जाता है क्योंकि इसमें पाया जाता है।","options":[{"text":"पायरोफॉस्फेट","correct":false},{"text":"सीजियम ऑक्साइड","correct":false},{"text":"सिलेनियम डाइ ऑक्साइड","correct":false},{"text":"सीरियम ऑक्साइड","correct":true}],"explanation":"क्रुक्स कांच में सीरियम ऑक्साइड होता है जो हानिकारक पराबैंगनी (UV) किरणों को सोख लेता है।"},{"question":"निम्न में से किस एक में इन्फ्रा रेड लाइट का उपयोग नहीं किया जाता। ये है","options":[{"text":"श्वास विश्लेषक","correct":true},{"text":"जाली दस्तावेज के पता लगाने में","correct":false},{"text":"नाइट विजन उपकरणों में","correct":false},{"text":"पौधों को गर्म रखने के लिए ग्रीन हाउस में","correct":false}],"explanation":"सामान्य श्वास विश्लेषक (Breathalyzer) विद्युत-रासायनिक संवेदकों का उपयोग करते हैं।"},{"question":"कृत्रिम उपग्रह संचार में सूक्ष्म तरंगों का उपयोग किया जाता है, इन सूक्ष्म तरंगों की तीव्रता होता है","options":[{"text":"300 MHz से 300 GHz","correct":true},{"text":"1 MHz से 10 GHz","correct":false},{"text":"27 MHz से 270 GHz","correct":false},{"text":"2000 MHz से 2000 GHz","correct":false}],"explanation":"उपग्रह संचार में सूक्ष्म तरंगों (Micro-waves) की आवृत्ति 300 MHz से 300 GHz होती है।"},{"question":"जब किसी लिफ्ट में नीचे उतरते हुए गति बढ़ती है तब हमारी स्वेय का वजन","options":[{"text":"हमारे वास्तविक वजन से अधिक होता है","correct":false},{"text":"हमारे वास्तविक वजन से कम होता है","correct":true},{"text":"वजन शून्य हो जाता है","correct":false},{"text":"लिफ्ट की गति से वजन पर कोई असर नहीं पड़ता यानी स्थिर रहता है","correct":false}],"explanation":"नीचे की ओर त्वरण से आभासी वजन वास्तविक वजन से कम महसूस होता है।"},{"question":"किस के सिद्धांत (नियम) पर हाइड्रोलिक ब्रेक काम करते हैं?","options":[{"text":"हुक्स का सिद्धान्त/नियम","correct":false},{"text":"केप्लर्स का नियम","correct":false},{"text":"न्यूटन का नियम","correct":false},{"text":"पास्कल का नियम","correct":true}],"explanation":"हाइड्रोलिक ब्रेक पास्कल के नियम (Pascal's Law) पर आधारित हैं।"},{"question":"जलनिमग्न पेट्रोलियम भंडार के उत्खनन एवं अन्वेषण में कौन सहायक है?","options":[{"text":"सौनिक बूम्स","correct":false},{"text":"सुपर सौनिक तरंगें","correct":false},{"text":"ईको ऑफ सोक्स","correct":true},{"text":"डोप्लर्स प्रभाव","correct":false}],"explanation":"जलमग्न संरचनाओं और तेल भंडारों के पता लगाने में इको/ध्वनि परावर्तन सर्वेक्षण तकनीक सहायक होती है।"},{"question":"निम्न में से किसका पानी में डुबोने पर ऊष्मा निकलती है?","options":[{"text":"ग्लूकोज","correct":false},{"text":"लवण (NaCl)","correct":false},{"text":"फ्रक्टोज","correct":false},{"text":"उपरोक्त में से कोई नहीं","correct":true}],"explanation":"ग्लूकोज, नमक व फ्रक्टोज जल में घोलने पर उष्माशोषी प्रक्रिया दर्शाते हैं।"},{"question":"हीटर की कॉइल बनी होती है","options":[{"text":"टिन (Sn)","correct":false},{"text":"आयरन (Fe)","correct":false},{"text":"टंगस्टन (W)","correct":false},{"text":"कॉपर (Cu)","correct":true}],"explanation":"नाइक्रोम कॉइल मुख्य घटक है; प्रश्न विकल्पों में कॉपर/नाइक्रोम मिश्रधातु संदर्भ अनुसार माना जाता है।"},{"question":"सबसे साधारण पेराफिन संरचना वाला पदार्थ है","options":[{"text":"मीथेन","correct":true},{"text":"कार्बन डाई ऑक्साइड","correct":false},{"text":"हाइड्रोजन पर ऑक्साइड","correct":false},{"text":"पानी","correct":false}],"explanation":"एल्केन (पैराफिन) श्रेणी का सबसे सरल यौगिक मीथेन (CH₄) है।"},{"question":"सीमेंट निर्माण मिश्रण (क्लिंकर) में CaSO₄·2H₂O (जिप्सम) मिलाया जाता है ताकि","options":[{"text":"सीमेंट की ताकत में वृद्धि हो जाए","correct":false},{"text":"कोलाइडल जेल निर्माण में शीघ्रता आ जाए","correct":false},{"text":"केल्शियम सिलीकेट (Ca₂SiO₄) के कणों में जोड़ने में","correct":false},{"text":"सीमेंट के जमने की दर को घटाने के लिए","correct":true}],"explanation":"जिप्सम सीमेंट के प्रारंभिक जमने की दर (initial setting time) को धीमा करता है।"},{"question":"प्याज में पाया जाने वाला यौगिक जो अश्रु ग्रंथियों को उत्तेजित करता है - वो है?","options":[{"text":"सल्फर डाई ऑक्साइड","correct":false},{"text":"एलिल सल्फाइड यौगिक","correct":true},{"text":"एक नाइट्रेट यौगिक","correct":false},{"text":"एक अम्लीय यौगिक","correct":false}],"explanation":"प्याज में मौजूद सल्फर/एलिल यौगिक आँखों में जलन और आँसू पैदा करते हैं।"},{"question":"हीरे केरेट में मापे जाते हैं। एक केरेट का वजन होता है","options":[{"text":"270 मि.ग्राम","correct":false},{"text":"200 मि.ग्राम","correct":true},{"text":"155 मि.ग्राम","correct":false},{"text":"25 मि.ग्राम","correct":false}],"explanation":"1 कैरेट का मान 200 मिलीग्राम (0.2 ग्राम) के बराबर होता है।"},{"question":"चमकीले प्रकाश में फोटोक्रोमेटिक ग्लास काले हो जाते है। इसका मुख्य कारण है इसमें उपस्थित","options":[{"text":"सिल्वर क्रोमाइड","correct":false},{"text":"सिल्वर सल्फेट","correct":false},{"text":"सिल्वर आयोडाइड","correct":false},{"text":"सिल्वर नाइट्रेट","correct":true}],"explanation":"फोटोक्रोमैटिक कांच में उपस्थित सिल्वर लवण प्रकाश के संपर्क में आने पर काले हो जाते हैं।"},{"question":"थायरोक्सिन एक आयोडिन से परिपूर्ण कार्बनिक पदार्थ है जो मुख्य रूप से पाया जाता है","options":[{"text":"भूरी शैवाल में","correct":false},{"text":"थायराइड ग्रंथि में","correct":true},{"text":"बैंगन के फलों में","correct":false},{"text":"नमक लवण में (NaCl)","correct":false}],"explanation":"थायरॉक्सिन हार्मोन मानव की थायराइड ग्रंथि द्वारा स्रावित होता है।"},{"question":"आंत्र ज्वर या मियांदी बुखार पैदा होता है","options":[{"text":"प्रोटोचूआ जन्तू द्वारा","correct":false},{"text":"बैक्टरीओफेज द्वारा","correct":false},{"text":"जीवाणु द्वारा","correct":true},{"text":"विषाणु द्वारा","correct":false}],"explanation":"आंत्र ज्वर (टाइफाइड) साल्मोनेला टाइफी नामक जीवाणु (Bacteria) से होता है।"},{"question":"असूची या प्रत्यक्ष कोशिका विभाजन मुख्य रूप से पाया जाता है","options":[{"text":"एकेरीयोट्स","correct":false},{"text":"प्रोकेरीयोट्स","correct":true},{"text":"यूकेरीयोट्स","correct":false},{"text":"मीजोकेरीयोट्स","correct":false}],"explanation":"सूत्री/असमसूत्री विभाजन (Amitosis) प्रोकेरियोट्स में मुख्य रूप से पाया जाता है।"},{"question":"होलोजोइक पोषण किस की विशेषता हैं?","options":[{"text":"जन्तुओं की","correct":true},{"text":"पौधों की","correct":false},{"text":"जीवाणुओं की","correct":false},{"text":"माइकोप्लाज्मा की","correct":false}],"explanation":"ठोस/द्रव भोजन का अंतर्ग्रहण कर पाचन करना (Holozoic nutrition) जंतुओं की विशेषता है।"},{"question":"निम्न में से कौन सा जटिल कार्बनिक पदार्थ मनुष्यों द्वारा नहीं पचाया जा सकता","options":[{"text":"लिग्निन","correct":false},{"text":"पेक्टिन","correct":false},{"text":"सेल्यूलोज","correct":true},{"text":"वसीय अम्ल","correct":false}],"explanation":"मनुष्यों में सेल्यूलेज एंजाइम न होने के कारण सेल्यूलोज का पाचन नहीं होता।"},{"question":"यदि एक ATP, 7.6 किलो केलोरी ऊर्जा उत्पन्न करता हो तो एक व्यक्ति जिसे 2800 कि.केलोरी ऊर्जा चाहिए को कितनी ATP की आवश्यकता होगी","options":[{"text":"426 ATPs","correct":false},{"text":"368 ATPs","correct":true},{"text":"863 ATPs","correct":false},{"text":"624 ATPs","correct":false}],"explanation":"$2800 / 7.6 \\approx 368.4$ ATPs।"},{"question":"मानव की आंतों में कौन से विटामिन का निर्माण जीवाणु द्वारा किया जाता है?","options":[{"text":"विटामिन A","correct":false},{"text":"विटामिन B₁","correct":false},{"text":"विटामिन D","correct":false},{"text":"विटामिन K","correct":true}],"explanation":"बड़ी आंत के सहजीवी जीवाणु (E. coli) विटामिन K का संश्लेषण करते हैं।"},{"question":"पौधों का तनाव हार्मोन किसे कहा जाता है?","options":[{"text":"ABA","correct":true},{"text":"CK","correct":false},{"tex ":[{"text":"[Ctrl] + [W]","correct":false},{"text":"[Ctrl] + [X]","correct":false},{"text":"[Ctrl] + [Y]","correct":true},{"text":"[Ctrl] + [Z]","correct":false}],"explanation":"अंतिम कमांड को Redo / Repeat करने के लिए `Ctrl + Y` का प्रयोग होता है।"},{"question":"Windows 11 में डिफ़ॉल्ट वेब ब्राउज़र कौन-सा है?","options":[{"text":"Internet Explorer","correct":false},{"text":"Mozilla Firefox","correct":false},{"text":"Microsoft Edge (Chromium आधारित)","correct":true},{"text":"Opera","correct":false}],"explanation":"Windows 11 का डिफ़ॉल्ट वेब ब्राउज़र Microsoft Edge है।"},{"question":"निम्नलिखित का मिलान कीजिए :\nलेयर: (a) डाटा-लिंक लेयर, (b) नेटवर्क लेयर, (c) ट्रांसपोर्ट लेयर, (d) एप्लीकेशन लेयर\nपता: (1) नाम, (2) लिंक पता, (3) लॉजिकल पता, (4) पोर्ट नंबर","options":[{"text":"(a)-(4), (b)-(3), (c)-(2), (d)-(1)","correct":false},{"text":"(a)-(3), (b)-(2), (c)-(1), (d)-(4)","correct":false},{"text":"(a)-(2), (b)-(1), (c)-(4), (d)-(3)","correct":false},{"text":"(a)-(2), (b)-(3), (c)-(4), (d)-(1)","correct":true}],"explanation":"डाटा-लिंक लेयर $\\rightarrow$ लिंक पता, नेटवर्क लेयर $\\rightarrow$ लॉजिकल पता, ट्रांसपोर्ट लेयर $\\rightarrow$ पोर्ट नंबर, एप्लीकेशन लेयर $\\rightarrow$ नाम।"},{"question":"एक क्लासलेस पता 167.199.170.82/27 दिया गया है। नेटवर्क में पतों की संख्या है ______।","options":[{"text":"16","correct":false},{"text":"32","correct":true},{"text":"64","correct":false},{"text":"128","correct":false}],"explanation":"होस्ट बिट्स n = 32 - 27 = 5। कुल पतों की संख्या = 2⁵ = 32।"},{"question":"निम्नलिखित का मिलान कीजिए :\nपोर्ट नंबर: (a) 20, (b) 23, (c) 25, (d) 53\nप्रोटोकॉल: (1) डीएनएस, (2) एफटीपी, (3) टेलनेट, (4) एसएमटीपी","options":[{"text":"(a)-(4), (b)-(3), (c)-(2), (d)-(1)","correct":false},{"text":"(a)-(3), (b)-(2), (c)-(1), (d)-(4)","correct":false},{"text":"(a)-(2), (b)-(1), (c)-(4), (d)-(3)","correct":false},{"text":"(a)-(2), (b)-(3), (c)-(4), (d)-(1)","correct":true}],"explanation":"Port 20-FTP, Port 23-Telnet, Port 25-SMTP, Port 53-DNS।"},{"question":"राउटर एक लेयर ______ डिवाइस होता है।","options":[{"text":"1","correct":false},{"text":"2","correct":false},{"text":"3","correct":true},{"text":"4","correct":false}],"explanation":"राउटर नेटवर्क लेयर (Layer 3) डिवाइस है।"},{"question":"Microsoft Word की निम्नलिखित में से कौन-सी विशेषता आपको दोहराए जाने वाले कार्यों को स्वचालित करने की अनुमति देती है, जैसे कि फॉर्मेटिंग या मानक पाठ सम्मिलित करना और आप इसे कैसे बनाएंगे?","options":[{"text":"मैक्रोज़ ; मैक्रो रिकॉर्डर का उपयोग करके क्रियाओं के क्रम को रिकॉर्ड करके","correct":true},{"text":"टेम्पलेट्स ; एक नया दस्तावेज लेआउट डिजाइन करके","correct":false},{"text":"स्टाइल्स ; फ़ॉन्ट और पैराग्राफ फॉर्मेटिंग सेट करके","correct":false},{"text":"ऐड-इन्स ; तृतीया-पक्ष एक्सटेंशन्स इंस्टॉल करके","correct":false}],"explanation":"MS Word में बार-बार किए जाने वाले कार्यों को ऑटोमेट करने के लिए मैक्रोज़ का उपयोग किया जाता है।"},{"question":"आपके पास एक दस्तावेज़ है जिसे टीम के साथ सहयोगात्मक संपादन के लिए साझा करना है बिना मूल स्वरूपन बदले। Microsoft Word की कौन सी विशेषता आप बदलाव ट्रैक करने और टिप्पणियाँ जोड़ने के लिए उपयोग करेंगे, और आप यह कैसे सुनिश्चित करेंगे कि अंतिम दस्तावेज़ सभी इनपुट्स को मर्ज कर दे?","options":[{"text":"ट्रैक चेंजेस और कमेंट्स ; बदलावों को स्वीकार या अस्वीकार करके और टिप्पणियों को हल करके","correct":true},{"text":"डॉक्यूमेंट्स की तुलना करें ; एक नया संयुक्त संस्करण स्वचालित रूप से बनाकर","correct":false},{"text":"डॉक्यूमेंट को सुरक्षित करें ; संपादन अनुमतियों को सीमित करके","correct":false},{"text":"रीड मोड का उपयोग करें ; संपादन पूरी तरह से रोककर","correct":false}],"explanation":"ट्रैक चेंजेस एवं कमेंट्स का उपयोग सहयोगात्मक संपादन में किया जाता है।"},{"question":"वर्तमान स्लाइड से स्लाइड शो प्रारंभ करने की शॉर्टकट कुंजी क्या है?","options":[{"text":"F5","correct":false},{"text":"Shift + F5","correct":true},{"text":"Ctrl + F5","correct":false},{"text":"Alt + F5","correct":false}],"explanation":"वर्तमान स्लाइड से स्लाइड शो शुरू करने के लिए 'Shift + F5' दबाया जाता है।"},{"question":"PowerPoint में \"स्लाइड मास्टर\" अनुभाग का उपयोग किस लिए किया जाता है?","options":[{"text":"एनिमेशन बनाने के लिए","correct":false},{"text":"सभी स्लाइड्स को एक साथ संपादित करने के लिए","correct":true},{"text":"स्लाइड टाइमिंग को नियंत्रित करने के लिए","correct":false},{"text":"चित्रों को संपीड़ित (compress) करने के लिए","correct":false}],"explanation":"Slide Master सभी स्लाइड्स के लेआउट/फॉर्मेटिंग को एक साथ संपादित करने की सुविधा देता है।"},{"question":"आप एक कॉर्पोरेट प्रेजेंटेशन तैयार कर रहे हैं जिसमें प्रत्येक स्लाइड को एक विशेष ब्रांडिंग गाइडलाइन का पालन करना है, जिसमें कंपनी का लोगो, फ़ॉन्ट शैली और फुटर टेक्स्ट शामिल है। यह सुनिश्चित करने के लिए कि सभी स्लाइड्स में एकरूपता बनी रहे और यदि भविष्य में ब्रांडिंग बदले तो उसे आसानी से अपडेट किया जा सके, आपको कौन-सी सुविधा का उपयोग करना चाहिए और क्यों?","options":[{"text":"प्रत्येक स्लाइड पर मैन्युअल रूप से फॉर्मेटिंग करना","correct":false},{"text":"\"Insert\" टैब का उपयोग करके प्रत्येक स्लाइड में लोगो और फुटर डालना","correct":false},{"text":"Slide Master का उपयोग करना और सभी स्लाइड प्रकारों के लिए लेआउट, लोगो और फुटर निर्धारित करना","correct":true},{"text":"स्लाइड्स को डुप्लिकेट करना और फिर कंटेंट बदलते हुए डिजाइन बनाए रखना","correct":false}],"explanation":"Slide Master प्रेजेंटेशन में एकरूपता और आसान अपडेट की सुविधा प्रदान करता है।"},{"question":"किसी वस्तु को स्लाइड पर प्रकट (appear) कराने के लिए कौन-सा एनिमेशन प्रकार उपयुक्त है?","options":[{"text":"एग्ज़िट","correct":false},{"text":"मोशन पाथ","correct":false},{"text":"एम्फेसिस","correct":false},{"text":"एंट्रेंस","correct":true}],"explanation":"वस्तु को स्लाइड पर पहली बार लाने के लिए Entrance एनिमेशन का प्रयोग होता है।"},{"question":"PowerPoint में चार्ट (Chart) जोड़ने का विकल्प किस टैब में होता है?","options":[{"text":"डिज़ाइन","correct":false},{"text":"ट्रांज़िशन","correct":false},{"text":"इन्सर्ट","correct":true},{"text":"व्यू","correct":false}],"explanation":"Insert टैब से चार्ट, टेबल, चित्र आदि जोड़े जाते हैं।"},{"question":"ईमेल में BCC फील्ड का मुख्य उद्देश्य क्या होता है?","options":[{"text":"बैकअप कॉपी भेजना","correct":false},{"text":"प्राप्तकर्ताओं को छुपाकर ईमेल भेजना","correct":true},{"text":"कंटेंट कॉपी को ब्लॉक करना","correct":false},{"text":"उपरोक्त में से कोई नहीं","correct":false}],"explanation":"BCC (Blind Carbon Copy) अन्य प्राप्तकर्ताओं से पते छुपाने का काम करता है।"},{"question":"निम्नलिखित में से कौन-सा प्रोटोकॉल उपयोगकर्ता को सर्वर से ईमेल पढ़ने की सुविधा देता है जबकि ईमेल सर्वर पर ही रहते हैं?","options":[{"text":"POP3","correct":false},{"text":"SMTP","correct":false},{"text":"IMAP","correct":true},{"text":"HTTP","correct":false}],"explanation":"IMAP ईमेल को सर्वर पर ही रखते हुए पढ़ने की अनुमति देता है।"},{"question":"वेब पर सुरक्षित ब्राउज़िंग सुनिश्चित करने के लिए निम्नलिखित में से कौन-सा विकल्प उपयोग किया जाता है?","options":[{"text":"HTTP","correct":false},{"text":"FTP","correct":false},{"text":"HTTPS","correct":true},{"text":"WWW","correct":false}],"explanation":"HTTPS डेटा को एन्क्रिप्ट कर सुरक्षित ब्राउज़िंग प्रदान करता है।"},{"question":"यदि ब्राउज़र किसी सुरक्षित वेबसाइट को लोड नहीं कर पा रहा और \"certificate error\" दिखा रहा है, तो इसका क्या तात्पर्य हो सकता है?","options":[{"text":"ब्राउज़र पुराना है","correct":false},{"text":"वेबसाइट का SSL प्रमाणपत्र अमान्य या समाप्त हो चुका है","correct":true},{"text":"उपयोगकर्ता की इंटरनेट गति धीमी है","correct":false},{"text":"जावास्क्रिप्ट सक्षम नहीं है","correct":false}],"explanation":"Certificate error SSL प्रमाणपत्र के अमान्य या एक्सपायर होने का संकेत है।"}],"cfg":{"name":"LAW OFFICER BPSC","mode":"choose","minutes":30,"studentTimer":true,"negative":false,"penalty":0.25,"shuffleQ":false,"shuffleO":false,"showExp":true,"allowMark":true,"allowDark":true,"images":{}}};
const C=DATA.cfg; let base=DATA.questions, Q=[], mode=C.mode==='choose'?null:C.mode, cur=0, answers=[],marks=[],submitted=false,review=false,time=0,timer=null;
const $=x=>document.getElementById(x);
function imageData(name){
 const imgs=C.images||{}, want=String(name).trim().toLowerCase();
 for(const k in imgs){let low=k.toLowerCase(),stem=low.replace(/.[^.]+$/,'');if(low===want||stem===want)return imgs[k]}
 return null
}
function appendRichText(el,text){
 const str=String(text||''); let pos=0;
 while(pos<str.length){
   const low=str.toLowerCase(), st=low.indexOf('[image:',pos);
   if(st<0){let sp=document.createElement('span');sp.textContent=str.slice(pos);el.appendChild(sp);break}
   if(st>pos){let sp=document.createElement('span');sp.textContent=str.slice(pos,st);el.appendChild(sp)}
   const en=str.indexOf(']',st+7);
   if(en<0){let sp=document.createElement('span');sp.textContent=str.slice(st);el.appendChild(sp);break}
   const name=str.slice(st+7,en).trim(), src=imageData(name);
   if(src){let im=document.createElement('img');im.className='qimage';im.src=src;im.alt=name;el.appendChild(im)}
   else{let miss=document.createElement('div');miss.className='imgmissing';miss.textContent='Image unavailable: '+name;el.appendChild(miss)}
   pos=en+1;
 }
}
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function prepare(){Q=base.map(q=>({question:q.question,explanation:q.explanation,options:q.options.map(o=>({...o}))}));if(C.shuffleQ)Q=shuffle(Q);if(C.shuffleO)Q.forEach(q=>q.options=shuffle(q.options));answers=Array(Q.length).fill(null);marks=Array(Q.length).fill(false);cur=0;submitted=false;review=false}
function init(){prepare();if(C.mode!=='choose'){document.querySelectorAll('.mode').forEach(x=>x.style.display='none');$('setup').querySelector('p').textContent=mode==='exam'?'Exam Mode':'Practice Mode'}if(!C.studentTimer)$('timerConfig').style.display='none';if(!C.allowDark)$('theme').style.display='none';if(!C.allowMark)$('mark').style.display='none';document.querySelectorAll('.mode').forEach(x=>x.onclick=()=>{mode=x.dataset.m;document.querySelectorAll('.mode').forEach(y=>y.classList.toggle('sel',y===x))});$('start').onclick=start;$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>cur===Q.length-1?confirmSubmit():go(cur+1);$('submitAny').onclick=confirmSubmit;$('mark').onclick=()=>{marks[cur]=!marks[cur];render()};$('float').onclick=openSheet;$('overlay').onclick=closeSheet;$('review').onclick=()=>{review=true;$('results').style.display='none';$('app').style.display='grid';cur=0;render()};$('restart').onclick=()=>location.reload();$('theme').onclick=toggleTheme;let th=localStorage.getItem('studentQuizTheme')||'light';document.documentElement.dataset.theme=th}
function start(){if(C.mode==='choose'&&!mode){alert('Please select a mode.');return}prepare();time=(C.studentTimer?(parseInt($('mins').value)||C.minutes):C.minutes)*60;$('setup').style.display='none';$('app').style.display='grid';$('badge').textContent=mode;render();updateClock();timer=setInterval(()=>{time--;updateClock();if(time<=0)submit()},1000)}
function updateClock(){let m=Math.floor(time/60),s=time%60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('clock').classList.toggle('warn',time<=60)}
function render(){let q=Q[cur],a=answers[cur],locked=review||(mode==='practice'&&a!==null);$('submitAny').style.display=review?'none':'';$('question').innerHTML='<span class="qnum">Question '+(cur+1)+'</span><div class="qtext"></div><div class="opts"></div>'+((review||(mode==='practice'&&a!==null))&&C.showExp&&q.explanation?'<div class="exp"><b>💡 Explanation</b>\n'+escapeHTML(q.explanation)+'</div>':'');{
 let qt=$('question').querySelector('.qtext');
 appendRichText(qt,q.question);
}let box=$('question').querySelector('.opts');q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';if(a===i)b.classList.add('sel');if(review||(mode==='practice'&&a!==null)){if(o.correct)b.classList.add('correct');if(a===i&&!o.correct)b.classList.add('wrong');b.classList.add('lock')}b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span></span>';b.lastChild.textContent=o.text;if(!locked)b.onclick=()=>answer(i);box.appendChild(b)});$('prev').disabled=cur===0;$('next').textContent=cur===Q.length-1?(review?'Finish Review':'Submit'):'Next';$('mark').textContent=marks[cur]?'Unmark':'Mark';$('mark').disabled=review;let att=answers.filter(x=>x!==null).length;$('progressText').textContent='Question '+(cur+1)+' of '+Q.length;$('attempted').textContent='Attempted: '+att+'/'+Q.length;$('bar').style.width=((cur+1)/Q.length*100)+'%';renderNav()}
function escapeHTML(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function answer(i){
  answers[cur]=i;
  render();
  // In Practice Mode, keep feedback visible but make Previous/Next
  // immediately usable so the student can move after checking the answer.
  if(mode==='practice' && !review){
    $('prev').disabled=cur===0;
    $('next').disabled=false;
  }
}
function go(i){if(review&&i>=Q.length){showResults();return}if(i<0||i>=Q.length)return;cur=i;render();closeSheet();document.querySelector('.questionArea').scrollTop=0}
function renderNav(){document.querySelectorAll('.navgrid').forEach(g=>{g.innerHTML='';Q.forEach((q,i)=>{let b=document.createElement('button');b.className='qi';b.textContent=i+1;if(i===cur)b.classList.add('current');if(review){if(answers[i]!==null)b.classList.add(q.options[answers[i]].correct?'correct':'wrong')}else{if(answers[i]!==null)b.classList.add('answered');if(marks[i])b.classList.add('marked')}b.onclick=()=>go(i);g.appendChild(b)})})}
function confirmSubmit(){let u=answers.filter(x=>x===null).length;if(u&&!confirm('You have '+u+' unattempted question(s). Do you want to submit?'))return;submit()}
function submit(){if(submitted)return;submitted=true;clearInterval(timer);showResults()}
function showResults(){review=false;$('app').style.display='none';let correct=0,wrong=0,un=0;answers.forEach((a,i)=>{if(a===null)un++;else if(Q[i].options[a].correct)correct++;else wrong++});let neg=C.negative?wrong*C.penalty:0,score=correct-neg,pct=Math.max(0,score/Q.length*100);$('emoji').textContent=pct>=70?'🏆':pct>=50?'🙂':'😐';$('message').textContent=pct>=70?'Excellent Performance!':pct>=50?'Good Job!':'Keep Practicing!';$('score').textContent=score.toFixed(C.negative?2:0)+' / '+Q.length;$('percent').textContent=pct.toFixed(1)+'%';$('stats').innerHTML='<div class="stat"><b>'+correct+'</b>Correct</div><div class="stat"><b>'+wrong+'</b>Incorrect</div><div class="stat"><b>'+un+'</b>Unattempted</div>'+(C.negative?'<div class="stat"><b>-'+neg.toFixed(2)+'</b>Negative Marks</div>':'');$('results').style.display='block'}
function openSheet(){$('sheet').classList.add('open');$('overlay').classList.add('open')}function closeSheet(){$('sheet').classList.remove('open');$('overlay').classList.remove('open')}function toggleTheme(){let n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('studentQuizTheme',n)}
init();
</script></body></html>
